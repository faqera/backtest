/* ---------- formatters ---------- */
function fmtD(d) { return d ? new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"2-digit" }) : "—"; }
function fmtDISODate(d) { if (!d) return ""; const dt=new Date(d); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function fmtN(v,dec) { return (v==null||isNaN(v)) ? "—" : Number(v).toFixed(dec==null?2:dec); }
function fmtRs(v) { if (v==null||isNaN(v)) return "—"; var n=Number(v), sign=n<0?"-":""; return sign+"₹"+Math.abs(Math.round(n)).toLocaleString("en-IN"); }
function inr(v) { return (v==null||isNaN(v)) ? "—" : Number(v).toLocaleString("en-IN",{maximumFractionDigits:2}); }
function csvEsc(v) { if (v==null) return ""; var s=String(v); return (s.indexOf(",")>=0||s.indexOf('"')>=0||s.indexOf("\n")>=0) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCSV(filename, rows) {
  var csv = rows.map(function(r){ return r.map(csvEsc).join(","); }).join("\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
}
function dateStamp() { var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function parseDateCell(s) {
  if (s == null) return null;
  const str = String(s).trim();
  if (!str) return null;
  if (str.indexOf("/")===-1 && str.indexOf("-")===-1 && str.indexOf(":")===-1) {
    const n = parseFloat(str);
    if (!isNaN(n) && n>25000 && n<100000) {
      const d = new Date((n-25569)*86400*1000);
      if (!isNaN(d.getTime())) return d;
    }
  }
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

async function fetchViaProxy(url) {
  const proxies = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://api.cors.lol/?url=" + encodeURIComponent(url),
    "https://thingproxy.freeboard.io/fetch/" + url,
    "https://corsproxy.io/?url=" + encodeURIComponent(url),
  ];
  let lastErr = "";
  for (let i = 0; i < proxies.length; i++) {
    try {
      const res = await fetch(proxies[i]);
      if (!res.ok) { lastErr = "HTTP " + res.status; continue; }
      const text = await res.text();
      if (text && text.length > 20) return text;
    } catch (e) { lastErr = e.message; }
  }
  throw new Error("Data नहीं मिला (" + lastErr + ")");
}

async function fetchFromYahoo(sym, range) {
  const clean = String(sym).toUpperCase().replace(/^NSE:/, "").trim();
  const ySym = clean + ".NS";
  const rng = range || DEFAULT_RANGE;
  const yUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + ySym + "?interval=1d&range=" + rng;
  const text = await fetchViaProxy(yUrl);
  let json;
  try { json = JSON.parse(text); } catch (e) { throw new Error("Yahoo response गलत"); }
  const r = json && json.chart && json.chart.result && json.chart.result[0];
  if (!r) throw new Error("Symbol गलत है या NSE पर listed नहीं");
  const ts = r.timestamp || [];
  const q = (r.indicators && r.indicators.quote && r.indicators.quote[0]) || {};
  const lines = ["Date,Open,High,Low,Close,Volume"];
  for (let i = 0; i < ts.length; i++) {
    const d = new Date(ts[i] * 1000);
    const ds = (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear();
    const o=q.open?q.open[i]:null, h=q.high?q.high[i]:null, l=q.low?q.low[i]:null, c=q.close?q.close[i]:null;
    const v = q.volume ? q.volume[i] : 0;
    if (o==null||h==null||l==null||c==null) continue;
    lines.push(ds+","+o+","+h+","+l+","+c+","+(v||0));
  }
  if (lines.length < 21) throw new Error("कम data मिला (" + (lines.length-1) + " rows)");
  return { csv: lines.join("\n"), name: "NSE:" + clean, rows: lines.length - 1 };
}

async function fetchSheetStocks() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_") === 0) throw new Error("Apps Script URL set नहीं किया");
  const res = await fetch(APPS_SCRIPT_URL);
  if (!res.ok) throw new Error("Apps Script HTTP " + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  const headers = json.headers || [];
  const rows = json.stocks || [];
  if (!rows.length) throw new Error("Sheet में कोई data नहीं मिला");
  const findCol = function(){
    const names = Array.prototype.slice.call(arguments);
    for (let i=0;i<names.length;i++) {
      const k = headers.find(function(h){ return String(h).toLowerCase().replace(/\s+/g,"") === names[i].toLowerCase().replace(/\s+/g,""); });
      if (k) return k;
    }
    for (let i=0;i<names.length;i++) {
      const k = headers.find(function(h){ return String(h).toLowerCase().includes(names[i].toLowerCase()); });
      if (k) return k;
    }
    return null;
  };
  const symCol  = findCol("symbol","sym","ticker","stock","scrip","nsecode");
  const nameCol = findCol("name","company","stockname","description");
  const bohCol  = findCol("boh","suitable","status","result","verdict","selection","filter");
  if (!symCol) throw new Error('"Symbol" column नहीं मिला। मिले: ' + headers.join(", "));
  const stocks = rows
    .map(function(r){
      const raw = String(r[symCol] || "").trim().toUpperCase().replace(/\.NS$|^NSE:/i, "");
      let suitable = true, bohText = "";
      if (bohCol) {
        const bv = String(r[bohCol] || "").trim();
        bohText = bv;
        suitable = !(/^(a|avoid|no|n|fail|false|0|✗|x)$/i.test(bv));
      }
      return { sym: raw, name: String(r[nameCol] || r[symCol] || "").trim(), suitable: suitable, bohText: bohText };
    })
    .filter(function(s){ return s.sym && /^[A-Z0-9&\-]+$/.test(s.sym); });
  if (!stocks.length) throw new Error("Sheet में valid symbol नहीं मिला");
  return { stocks: stocks, cols: headers, totalRows: rows.length, hasBoh: !!bohCol };
}

function parseCSV(raw, minPeriod) {
  if (!raw || !raw.trim()) return { error: "CSV खाली है।" };
  minPeriod = minPeriod || DEFAULT_PERIOD;
  const lines = raw.trim().split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
  let stockName = "", hIdx = -1;
  for (let i = 0; i < Math.min(lines.length, 12); i++) {
    if (/^date/i.test(lines[i])) { hIdx = i; break; }
    const p = lines[i].split(",");
    const cell = p[0] ? p[0].trim() : "";
    if (cell && !/^\d/.test(cell) && !/\*/.test(cell) && cell.length > 1 && cell.toUpperCase() !== "STOCK") stockName = cell;
  }
  if (hIdx === -1) return { error: 'Header row "Date,Open,High,Low,Close" नहीं मिला।' };
  const hdr = lines[hIdx].split(",").map(function(h){ return h.trim().toLowerCase(); });
  const gi = function(){
    for (let j = 0; j < arguments.length; j++) {
      const x = hdr.indexOf(arguments[j]);
      if (x >= 0) return x;
    }
    return -1;
  };
  const di=gi("date","datetime","time"), oi=gi("open"), hi=gi("high"), li=gi("low"), ci=gi("close"), vi=gi("volume","vol");
  if ([di,hi,li].some(function(x){ return x < 0; })) return { error: "Date / High / Low columns नहीं मिले।" };
  const rows = [];
  for (let i = hIdx+1; i < lines.length; i++) {
    const p = lines[i].split(",");
    if (p.length < 4) continue;
    const ds = p[di] ? p[di].trim() : "";
    if (!ds) continue;
    const d = parseDateCell(ds);
    if (!d) continue;
    const high=parseFloat(p[hi]), low=parseFloat(p[li]);
    const close = ci>=0 ? parseFloat(p[ci]) : high;
    const open  = oi>=0 ? parseFloat(p[oi]) : close;
    const vol   = vi>=0 ? (parseInt(p[vi])||0) : 0;
    if (isNaN(high) || isNaN(low)) continue;
    rows.push({ date: d, open: open, high: high, low: low, close: close, vol: vol, ts: d.getTime() });
  }
  rows.sort(function(a,b){ return a.ts - b.ts; });
  if (rows.length < minPeriod) return { error: "कम से कम " + minPeriod + " rows चाहिए। मिले: " + rows.length };
  return { stockName: stockName, rows: rows };
}

/* ================================================================
   CORE STRATEGY — 20D Breakout + GTT + 3-BUY AVERAGING
   Rule 1: Today Low = 20D Low → GTT signal
   Rule 2: GTT @ 20D High
   Rule 3: GTT daily trailing down
   Rule 5: 1st Buy target 20%
   Rule 6: 2nd Buy target 15%
   Rule 7: 3rd Buy target 10%
   Rule 9: Fixed ₹ amount per buy
   ================================================================ */
function calcSignals(rows, period, eps, fixedAmount, targetSteps) {
  period = period || DEFAULT_PERIOD;
  eps = eps == null ? DEFAULT_EPS : eps;
  fixedAmount = fixedAmount || DEFAULT_FIXED_AMOUNT;
  targetSteps = targetSteps || DEFAULT_TARGETS;

  const enriched = rows.map(function(r, i) {
    if (i < period - 1) return Object.assign({}, r, { d20L: null, d20H: null, prevD20H: null, newLow: false, events: [], gttPrice: null });
    const win = rows.slice(i - period + 1, i + 1);
    const d20L = Math.min.apply(null, win.map(function(x){ return x.low; }));
    const d20H = Math.max.apply(null, win.map(function(x){ return x.high; }));
    return Object.assign({}, r, { d20L: d20L, d20H: d20H, prevD20H: null, newLow: r.low <= d20L + eps, events: [], gttPrice: null });
  });
  for (let i = 1; i < enriched.length; i++) {
    if (enriched[i-1].d20H != null) enriched[i].prevD20H = enriched[i-1].d20H;
  }

  let buys = [];               // [{ date, price, qty, buyIdx }]
  let totalShares = 0;
  let totalCost = 0;
  let avgPrice = 0;
  let targetPrice = 0;
  let currentTargetPct = 0;
  let gttActive = false;
  const trades = [];

  function doExit(r) {
    const exitPrice = targetPrice;
    r.events.push("target");
    trades.push({
      buys: buys.slice(),
      entryDate: buys[0].date,
      exitDate: r.date,
      numBuys: buys.length,
      shares: totalShares,
      cost: totalCost,
      exit: exitPrice,
      proceeds: totalShares * exitPrice,
      pnl: totalShares * exitPrice - totalCost,
      pct: (exitPrice / avgPrice - 1) * 100,
      targetPct: currentTargetPct,
      days: Math.round((r.ts - buys[0].date.getTime()) / 86400000)
    });
    buys = []; totalShares = 0; totalCost = 0; avgPrice = 0; targetPrice = 0;
    currentTargetPct = 0; gttActive = false;
  }

  for (let i = 0; i < enriched.length; i++) {
    const r = enriched[i];
    if (r.d20H == null) continue;

    // 1. Target hit → EXIT ALL
    if (totalShares > 0 && r.high >= targetPrice - eps) {
      doExit(r);
      continue;
    }

    // 2. GTT trigger → BUY
    if (gttActive) {
      const trigger = r.prevD20H;
      if (trigger != null && r.high >= trigger - eps) {
        const qty = Math.max(1, Math.floor(fixedAmount / trigger));
        const buyIdx = buys.length;
        buys.push({ date: r.date, price: trigger, qty: qty, buyIdx: buyIdx });
        totalShares += qty;
        totalCost += qty * trigger;
        avgPrice = totalCost / totalShares;
        currentTargetPct = targetSteps[Math.min(buyIdx, targetSteps.length - 1)];
        targetPrice = avgPrice * (1 + currentTargetPct);
        gttActive = false;

        r.events.push(buyIdx === 0 ? "buy" : ("buy" + (buyIdx + 1)));
        r.gttPrice = trigger;
        r.buyPrice = trigger;
        r.buyQty = qty;
        r.buyIdx = buyIdx;
        r.position = { avgPrice: avgPrice, target: targetPrice, shares: totalShares, buys: buys.length, targetPct: currentTargetPct };

        // Same-day target check
        if (r.high >= targetPrice - eps) {
          doExit(r);
        }
        continue;
      }
      // GTT trailing (display only; next day's trigger uses r.d20H via prevD20H)
      r.gttPrice = r.d20H;
      continue;
    }

    // 3. newLow → place GTT (fresh entry OR averaging)
    if (r.newLow && buys.length < MAX_BUYS) {
      gttActive = true;
      r.events.push("gtt-placed");
      r.gttPrice = r.d20H;
      continue;
    }

    // 4. holding, no new action — record position for display
    if (totalShares > 0) {
      r.position = { avgPrice: avgPrice, target: targetPrice, shares: totalShares, buys: buys.length, targetPct: currentTargetPct };
    }
  }

  let openPosition = null;
  if (totalShares > 0) {
    openPosition = {
      buys: buys.slice(),
      avgPrice: avgPrice, target: targetPrice, shares: totalShares,
      cost: totalCost, targetPct: currentTargetPct,
      entryDate: buys[0].date, numBuys: buys.length
    };
  }
  let pendingGtt = null;
  if (gttActive) {
    const last = enriched[enriched.length - 1];
    pendingGtt = { price: last.d20H, date: last.date };
  }
  return { rows: enriched, trades: trades, openPosition: openPosition, pendingGtt: pendingGtt, fixedAmount: fixedAmount };
}

function calcPortfolioStats(stocks) {
  if (!stocks || !stocks.length) return null;
  var totalTrades=0, wins=0, losses=0, grossWin=0, grossLoss=0;
  var heldDays=0, openCount=0, gttCount=0, idleCount=0;
  var totalInvestedRs=0, totalProfitRs=0, totalReturnedRs=0;
  var perStock = [];
  for (var i = 0; i < stocks.length; i++) {
    var s = stocks[i];
    var t = s.trades || [];
    var w=0, l=0, sw=0, sl=0, d=0;
    var investedRs=0, returnedRs=0, profitRs=0;
    for (var j = 0; j < t.length; j++) {
      var tr = t[j];
      if (tr.pnl > 0) { w++; sw += tr.pct; } else { l++; sl += Math.abs(tr.pct); }
      d += (tr.days || 0);
      investedRs += tr.cost;
      returnedRs += tr.proceeds;
      profitRs += tr.pnl;
    }
    totalTrades += t.length; wins += w; losses += l;
    grossWin += sw; grossLoss += sl; heldDays += d;
    totalInvestedRs += investedRs; totalReturnedRs += returnedRs; totalProfitRs += profitRs;
    var status = s.openPosition ? "HOLDING" : (s.pendingGtt ? "GTT" : "IDLE");
    if (s.openPosition) openCount++; else if (s.pendingGtt) gttCount++; else idleCount++;
    var lastRow = s.rows && s.rows.length ? s.rows[s.rows.length - 1] : null;
    perStock.push({
      name: s.name, trades: t.length, wins: w, losses: l,
      winRate: t.length ? (w / t.length) * 100 : 0,
      avgWin: w ? sw / w : 0, avgLoss: l ? sl / l : 0,
      netPct: sw - sl, status: status,
      lastClose: lastRow ? lastRow.close : null,
      amount: s.amount || DEFAULT_FIXED_AMOUNT,
      investedRs: investedRs, returnedRs: returnedRs, profitRs: profitRs,
      buysOpen: s.openPosition ? s.openPosition.numBuys : 0
    });
  }
  var winRate = totalTrades ? (wins / totalTrades) * 100 : 0;
  var avgWin = wins ? grossWin / wins : 0;
  var avgLoss = losses ? grossLoss / losses : 0;
  var profitFactor = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0);
  var expectancy = totalTrades ? ((wins / totalTrades) * avgWin - (losses / totalTrades) * avgLoss) : 0;
  return {
    totalStocks: stocks.length, totalTrades: totalTrades,
    wins: wins, losses: losses, winRate: winRate,
    avgWin: avgWin, avgLoss: avgLoss, grossWin: grossWin, grossLoss: grossLoss,
    netPct: grossWin - grossLoss, profitFactor: profitFactor, expectancy: expectancy,
    openCount: openCount, gttCount: gttCount, idleCount: idleCount,
    avgHeldDays: totalTrades ? heldDays / totalTrades : 0,
    totalInvestedRs: totalInvestedRs, totalReturnedRs: totalReturnedRs, totalProfitRs: totalProfitRs,
    perStock: perStock
  };
}

function calcEquityCurve(stocks) {
  if (!stocks || !stocks.length) return null;
  var allTrades = [];
  for (var i = 0; i < stocks.length; i++) {
    var s = stocks[i];
    (s.trades || []).forEach(function(t){
      allTrades.push({
        ts: t.exitDate.getTime(), date: t.exitDate, profit: t.pnl,
        stock: s.name, entry: t.buys[0].price, exit: t.exit,
        shares: t.shares, numBuys: t.numBuys
      });
    });
  }
  if (!allTrades.length) return null;
  allTrades.sort(function(a,b){ return a.ts - b.ts; });
  var pts = []; var cum=0, peak=0, maxDD=0, maxDDPeak=0, maxDDTrough=0;
  for (var k = 0; k < allTrades.length; k++) {
    cum += allTrades[k].profit;
    if (cum > peak) peak = cum;
    var dd = peak - cum;
    if (dd > maxDD) { maxDD = dd; maxDDPeak = peak; maxDDTrough = cum; }
    pts.push({ ts: allTrades[k].ts, date: allTrades[k].date, profit: allTrades[k].profit, cum: cum, peak: peak, dd: dd, stock: allTrades[k].stock });
  }
  return { points: pts, allTrades: allTrades, maxDrawdown: maxDD, peakEquity: peak, finalEquity: cum, totalProfit: cum, tradeCount: allTrades.length, maxDDPeak: maxDDPeak, maxDDTrough: maxDDTrough };
}

function calcScreenerRow(stock) {
  var rows = stock.rows;
  var last = rows[rows.length - 1];
  var status = "IDLE", label = "⏳ IDLE", priority = 4, detail = "";
  if (stock.openPosition) {
    status = "HOLDING"; label = "📈 HOLDING"; priority = 2;
    var op = stock.openPosition;
    detail = "Buys " + op.numBuys + "/" + MAX_BUYS + " · Avg ₹" + fmtN(op.avgPrice) + " → T ₹" + fmtN(op.target) + " (" + (op.targetPct*100).toFixed(0) + "%)";
  } else if (stock.pendingGtt) {
    status = "GTT"; label = "🔔 GTT Active"; priority = 3;
    detail = "GTT @ ₹" + fmtN(stock.pendingGtt.price);
  }
  for (var i = rows.length - 1; i >= Math.max(0, rows.length - 10); i--) {
    var r = rows[i];
    var re = r.events || [];
    var buyEv = re.find(function(e){ return /^buy/.test(e); });
    if (buyEv) {
      var ago = rows.length - 1 - i;
      if (ago <= 1) {
        status = "BUY_TODAY"; label = "✅ " + (buyEv==="buy"?"BUY":"BUY" + buyEv.slice(3)); priority = 0;
        detail = buyEv + " @ ₹" + fmtN(r.buyPrice) + " × " + r.buyQty + " (" + (ago === 0 ? "आज" : "कल") + ")";
      }
      break;
    }
    if (re.indexOf("target") >= 0) {
      var ago2 = rows.length - 1 - i;
      if (ago2 <= 1) { status = "TARGET_TODAY"; label = "🎯 TARGET"; priority = 0; detail = "Target hit (" + (ago2 === 0 ? "आज" : "कल") + ")"; }
      break;
    }
    if (re.indexOf("gtt-placed") >= 0) {
      var ago3 = rows.length - 1 - i;
      if (ago3 <= 1 && status === "IDLE") { status = "NEW_LOW"; label = "🆕 New Low"; priority = 1; detail = "नया Low → GTT लगा"; }
      break;
    }
  }
  if (last.newLow && !stock.openPosition && stock.pendingGtt) {
    status = "NEW_LOW"; label = "🆕 New Low"; priority = 1;
    detail = "आज नया Low → GTT @ ₹" + fmtN(stock.pendingGtt.price);
  }
  return {
    name: stock.name, status: status, label: label, priority: priority, detail: detail,
    close: last.close, d20H: last.d20H, d20L: last.d20L, date: last.date,
    gtt: stock.pendingGtt ? stock.pendingGtt.price : null,
    target: stock.openPosition ? stock.openPosition.target : null,
    avg: stock.openPosition ? stock.openPosition.avgPrice : null,
    numBuys: stock.openPosition ? stock.openPosition.numBuys : 0,
    amount: stock.amount || DEFAULT_FIXED_AMOUNT
  };
}

function MiniChart(props) {
  var rows = props.rows, chartType = props.chartType || "candle", period = props.period || DEFAULT_PERIOD, height = props.height || 320;
  var hov = React.useState(null); var hover = hov[0]; var setHover = hov[1];
  var W=800, H=height, PAD={l:50,r:10,t:20,b:30};
  var iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  var data = rows.filter(function(r){ return r.d20H != null; });
  if (!data.length) return null;
  var allVals=[]; data.forEach(function(r){ allVals.push(r.close,r.d20H,r.d20L,r.high,r.low); });
  var minV=Math.min.apply(null,allVals), maxV=Math.max.apply(null,allVals), range=(maxV-minV)||1;
  var minT=data[0].ts, maxT=data[data.length-1].ts;
  var x=function(ts){ return PAD.l+((ts-minT)/(maxT-minT))*iw; };
  var y=function(v){ return PAD.t+ih-((v-minV)/range)*ih; };
  var slot=iw/data.length, bodyW=Math.max(1,Math.min(10,slot*0.7));
  var line=function(key){ return data.map(function(r,i){ return (i?'L':'M')+x(r.ts).toFixed(1)+","+y(r[key]).toFixed(1); }).join(" "); };
  var yLabels=[]; for (var i=0;i<=4;i++) yLabels.push(minV+(range*i/4));
  var xticks=Math.min(6,data.length), xIdx=[];
  for (var j=0;j<xticks;j++) xIdx.push(Math.floor(j*(data.length-1)/(xticks-1||1)));
  return (
    <div style={{overflowX:"auto"}}>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",minWidth:340,height:height,display:"block"}}>
        {yLabels.map(function(v,k){
          return <g key={k}><line x1={PAD.l} x2={W-PAD.r} y1={y(v)} y2={y(v)} stroke="#101f35" strokeDasharray="3 3"/>
          <text x={PAD.l-4} y={y(v)+3} fill="#334a6a" fontSize="10" textAnchor="end">{"₹"+v.toFixed(0)}</text></g>;
        })}
        {xIdx.map(function(idx,k){
          return <text key={k} x={x(data[idx].ts)} y={H-10} fill="#334a6a" fontSize="9" textAnchor="middle">
            {(data[idx].date.getMonth()+1)+"/"+String(data[idx].date.getFullYear()).slice(2)}</text>;
        })}
        {chartType==="candle" && data.map(function(r,k){
          var cx=x(r.ts), up=r.close>=r.open, col=up?"#22c55e":"#ef4444";
          var top=up?y(r.close):y(r.open), bot=up?y(r.open):y(r.close), bh=Math.max(1,bot-top);
          return <g key={"c"+k}><line x1={cx} x2={cx} y1={y(r.high)} y2={y(r.low)} stroke={col} strokeWidth="1"/>
          <rect x={cx-bodyW/2} y={top} width={bodyW} height={bh} fill={col} stroke={col} strokeWidth="0.5"/></g>;
        })}
        {chartType==="line" && <path d={line("close")} fill="none" stroke="#60a5fa" strokeWidth="2"/>}
        <path d={line("d20H")} fill="none" stroke="#f87171" strokeWidth="1.2" strokeDasharray="5 3"/>
        <path d={line("d20L")} fill="none" stroke="#34d399" strokeWidth="1.2" strokeDasharray="5 3"/>
        {data.map(function(r,k){
          var ev=r.events||[];
          if (ev.indexOf("target")>=0) return <circle key={"t"+k} cx={x(r.ts)} cy={y(r.high)} r="5" fill="#fbbf24" stroke="#1c1407" strokeWidth="1.5"/>;
          if (ev.indexOf("buy3")>=0) return <circle key={"b3"+k} cx={x(r.ts)} cy={y(r.low)} r="6" fill="#f472b6" stroke="#500724" strokeWidth="1.5"/>;
          if (ev.indexOf("buy2")>=0) return <circle key={"b2"+k} cx={x(r.ts)} cy={y(r.low)} r="6" fill="#38bdf8" stroke="#082f49" strokeWidth="1.5"/>;
          if (ev.indexOf("buy")>=0) return <circle key={"b"+k} cx={x(r.ts)} cy={y(r.low)} r="6" fill="#4ade80" stroke="#052e16" strokeWidth="1.5"/>;
          if (ev.indexOf("gtt-placed")>=0) return <circle key={"g"+k} cx={x(r.ts)} cy={y(r.low)} r="3" fill="#fbbf24"/>;
          return null;
        })}
        {data.map(function(r,k){
          return <rect key={k} x={x(r.ts)-slot/2} y={PAD.t} width={slot} height={ih} fill="transparent" onMouseEnter={function(){setHover(r);}} onTouchStart={function(){setHover(r);}}/>;
        })}
      </svg>
      {hover && <div style={{background:"#0f1e33",border:"1px solid #2a3f5f",borderRadius:8,padding:"8px 12px",fontSize:11,lineHeight:1.7,fontFamily:"monospace",margin:"4px 10px"}}>
        <div style={{fontWeight:700,color:"#a0bde0"}}>{fmtD(hover.date)}</div>
        <div style={{color:"#94a3b8"}}>O: ₹{fmtN(hover.open)} H: ₹{fmtN(hover.high)}</div>
        <div style={{color:"#94a3b8"}}>L: ₹{fmtN(hover.low)} C: ₹{fmtN(hover.close)}</div>
        <div style={{color:"#f87171"}}>{period}D High: ₹{fmtN(hover.d20H)}</div>
        <div style={{color:"#34d399"}}>{period}D Low: ₹{fmtN(hover.d20L)}</div>
        {hover.gttPrice && !(hover.events||[]).some(function(e){ return /^buy/.test(e); }) && <div style={{color:"#fbbf24",fontWeight:700}}>🔔 GTT @ ₹{fmtN(hover.gttPrice)}</div>}
        {(hover.events||[]).some(function(e){ return /^buy/.test(e); }) && <div style={{color:"#4ade80",fontWeight:700}}>✅ {hover.events.find(function(e){ return /^buy/.test(e); })} @ ₹{fmtN(hover.buyPrice)} × {hover.buyQty}</div>}
        {hover.position && !(hover.events||[]).includes("target") && <div style={{color:"#93c5fd"}}>🎯 T ₹{fmtN(hover.position.target)} · Avg ₹{fmtN(hover.position.avgPrice)} · Buys {hover.position.buys}/{MAX_BUYS}</div>}
        {(hover.events||[]).includes("target") && <div style={{color:"#fbbf24",fontWeight:700}}>🎯 TARGET HIT</div>}
      </div>}
      <div style={{padding:"4px 14px",fontSize:11,color:"#64748b",display:"flex",gap:10,flexWrap:"wrap"}}>
        <span style={{color:"#4ade80"}}>● Buy 1</span>
        <span style={{color:"#38bdf8"}}>● Buy 2</span>
        <span style={{color:"#f472b6"}}>● Buy 3</span>
        <span style={{color:"#fbbf24"}}>● Target</span>
        <span style={{color:"#f87171"}}>┄ {period}D High</span>
        <span style={{color:"#34d399"}}>┄ {period}D Low</span>
      </div>
    </div>
  );
}

function EquityCurveChart(props) {
  var data=props.data, height=props.height||280;
  if (!data || !data.points.length) return <div style={{padding:30,textAlign:"center",color:"#64748b",fontSize:12}}>कोई closed trade नहीं।</div>;
  var hov=React.useState(null); var hover=hov[0]; var setHover=hov[1];
  var W=800, H=height, PAD={l:75,r:15,t:22,b:30};
  var iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  var pts=data.points;
  var zeroTs=pts[0].ts-7*86400000;
  var extended=[{ts:zeroTs,date:new Date(zeroTs),cum:0,profit:0,peak:0,dd:0,isStart:true,stock:"Start"}].concat(pts);
  var minTs=extended[0].ts, maxTs=extended[extended.length-1].ts;
  if (maxTs<=minTs) maxTs=minTs+86400000;
  var cums=extended.map(function(p){ return p.cum; });
  var minV=Math.min.apply(null,cums), maxV=Math.max.apply(null,cums);
  minV=Math.min(minV,0); maxV=Math.max(maxV,0);
  if (minV===maxV) { minV-=100; maxV+=100; }
  var pad=(maxV-minV)*0.12; minV-=pad; maxV+=pad;
  var range=maxV-minV;
  var x=function(ts){ return PAD.l+((ts-minTs)/(maxTs-minTs))*iw; };
  var y=function(v){ return PAD.t+ih-((v-minV)/range)*ih; };
  var linePath=extended.map(function(p,i){ return (i?'L':'M')+x(p.ts).toFixed(1)+","+y(p.cum).toFixed(1); }).join(" ");
  var areaPath=linePath+" L "+x(maxTs).toFixed(1)+","+y(0).toFixed(1)+" L "+x(minTs).toFixed(1)+","+y(0).toFixed(1)+" Z";
  var yLabels=[]; for (var i=0;i<=4;i++) yLabels.push(minV+(range*i/4));
  var xticks=Math.min(6,extended.length), xIdx=[];
  for (var j=0;j<xticks;j++) xIdx.push(Math.floor(j*(extended.length-1)/(xticks-1||1)));
  var peakIdx=0;
  for (var k=1;k<extended.length;k++) if (extended[k].cum>extended[peakIdx].cum) peakIdx=k;
  var troughIdx=-1;
  if (data.maxDrawdown>0) { for (var m=0;m<extended.length;m++) { if (extended[m].dd===data.maxDrawdown) { troughIdx=m; break; } } }
  var finalCum=pts[pts.length-1].cum;
  var lineCol=finalCum>=0?"#4ade80":"#f87171";
  var fillCol=finalCum>=0?"rgba(74,222,128,0.10)":"rgba(248,113,113,0.10)";
  return (
    <div style={{overflowX:"auto"}}>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",minWidth:340,height:height,display:"block"}}>
        {yLabels.map(function(v,k){
          return <g key={k}><line x1={PAD.l} x2={W-PAD.r} y1={y(v)} y2={y(v)} stroke="#101f35" strokeDasharray="3 3"/>
          <text x={PAD.l-4} y={y(v)+3} fill="#334a6a" fontSize="10" textAnchor="end">{fmtRs(v)}</text></g>;
        })}
        {minV<=0 && maxV>=0 && <line x1={PAD.l} x2={W-PAD.r} y1={y(0)} y2={y(0)} stroke="#475569" strokeWidth="1" strokeDasharray="2 3"/>}
        <path d={areaPath} fill={fillCol}/>
        <path d={linePath} fill="none" stroke={lineCol} strokeWidth="2.2" strokeLinejoin="round"/>
        {extended.map(function(p,k){ if (p.isStart) return null; return <circle key={k} cx={x(p.ts)} cy={y(p.cum)} r="2.5" fill={lineCol}/>; })}
        {peakIdx>0 && <g><circle cx={x(extended[peakIdx].ts)} cy={y(extended[peakIdx].cum)} r="5" fill="#4ade80" stroke="#052e16" strokeWidth="1.5"/>
        <text x={x(extended[peakIdx].ts)} y={y(extended[peakIdx].cum)-8} fill="#4ade80" fontSize="9" textAnchor="middle" fontWeight="700">PEAK</text></g>}
        {troughIdx>0 && <g><circle cx={x(extended[troughIdx].ts)} cy={y(extended[troughIdx].cum)} r="5" fill="#f87171" stroke="#450a0a" strokeWidth="1.5"/>
        <text x={x(extended[troughIdx].ts)} y={y(extended[troughIdx].cum)+14} fill="#f87171" fontSize="9" textAnchor="middle" fontWeight="700">MAX DD</text></g>}
        {xIdx.map(function(idx,k){
          return <text key={k} x={x(extended[idx].ts)} y={H-10} fill="#334a6a" fontSize="9" textAnchor="middle">
            {(extended[idx].date.getMonth()+1)+"/"+String(extended[idx].date.getFullYear()).slice(2)}</text>;
        })}
        {extended.map(function(p,k){ if (p.isStart) return null; return <rect key={"h"+k} x={x(p.ts)-8} y={PAD.t} width="16" height={ih} fill="transparent" onMouseEnter={function(){setHover(p);}} onTouchStart={function(){setHover(p);}}/>; })}
      </svg>
      {hover && <div style={{background:"#0f1e33",border:"1px solid #2a3f5f",borderRadius:8,padding:"8px 12px",fontSize:11,lineHeight:1.7,fontFamily:"monospace",margin:"4px 10px"}}>
        <div style={{fontWeight:700,color:"#a0bde0"}}>{fmtD(hover.date)}</div>
        <div style={{color:"#93c5fd"}}>{hover.stock}</div>
        {!hover.isStart && <div style={{color:"#94a3b8"}}>Trade: <b style={{color: hover.profit>=0?"#4ade80":"#f87171"}}>{hover.profit>=0?"+":""}{fmtRs(hover.profit)}</b></div>}
        <div style={{color: lineCol, fontWeight:700}}>Cumulative: {hover.cum>=0?"+":""}{fmtRs(hover.cum)}</div>
        {hover.dd>0 && <div style={{color:"#f87171"}}>Drawdown: -{fmtRs(hover.dd)}</div>}
      </div>}
      <div style={{padding:"6px 14px",fontSize:11,color:"#64748b",display:"flex",gap:14,flexWrap:"wrap"}}>
        <span>Final: <b style={{color: lineCol}}>{finalCum>=0?"+":""}{fmtRs(finalCum)}</b></span>
        <span>Peak: <b style={{color:"#4ade80"}}>{fmtRs(data.peakEquity)}</b></span>
        <span>Max DD: <b style={{color:"#f87171"}}>-{fmtRs(data.maxDrawdown)}</b></span>
        <span>Trades: <b style={{color:"#93c5fd"}}>{data.tradeCount}</b></span>
      </div>
    </div>
  );
}

  var rows=stocks.map(function(s,idx){ var r=calcScreenerRow(s); r.idx=idx; return r; });
  rows.sort(function(a,b){ if (a.priority!==b.priority) return a.priority-b.priority; return a.name.localeCompare(b.name); });
  var filtered=rows;
  if (filter==="buy") filtered=rows.filter(function(r){ return r.status==="BUY_TODAY"; });
  else if (filter==="gtt") filtered=rows.filter(function(r){ return r.status==="GTT"||r.status==="NEW_LOW"; });
  else if (filter==="holding") filtered=rows.filter(function(r){ return r.status==="HOLDING"; });
  else if (filter==="newlow") filtered=rows.filter(function(r){ return r.status==="NEW_LOW"; });
  else if (filter==="target") filtered=rows.filter(function(r){ return r.status==="TARGET_TODAY"; });
  var counts={
    all:rows.length,
    buy:rows.filter(function(r){ return r.status==="BUY_TODAY"; }).length,
    gtt:rows.filter(function(r){ return r.status==="GTT"||r.status==="NEW_LOW"; }).length,
    holding:rows.filter(function(r){ return r.status==="HOLDING"; }).length,
    newlow:rows.filter(function(r){ return r.status==="NEW_LOW"; }).length,
    target:rows.filter(function(r){ return r.status==="TARGET_TODAY"; }).length
  };
  var filters=[
    {key:"all",lbl:"All",count:counts.all},
    {key:"buy",lbl:"✅ Buy",count:counts.buy},
    {key:"newlow",lbl:"🆕 New Low",count:counts.newlow},
    {key:"gtt",lbl:"🔔 GTT",count:counts.gtt},
    {key:"holding",lbl:"📈 Holding",count:counts.holding},
    {key:"target",lbl:"🎯 Target",count:counts.target}
  ];
  function exportScreener(){
    var data=[["Stock","₹/buy","Status","Detail","Latest Close",period+"D High",period+"D Low","GTT Price","Avg","Target","Buys","As of"]];
    rows.forEach(function(r){
      data.push([r.name,r.amount,r.status,r.detail,
        r.close!=null?r.close.toFixed(2):"", r.d20H!=null?r.d20H.toFixed(2):"", r.d20L!=null?r.d20L.toFixed(2):"",
        r.gtt!=null?r.gtt.toFixed(2):"", r.avg!=null?r.avg.toFixed(2):"", r.target!=null?r.target.toFixed(2):"",
        r.numBuys||0, fmtD(r.date)]);
    });
    downloadCSV("screener_"+dateStamp()+".csv", data);
  }
  return (
    <div style={{padding:"0 16px 20px"}}>
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {filters.map(function(f){
          return <button key={f.key} onClick={function(){ setFilter(f.key); }} style={{
            background:filter===f.key?C.accent:"none",color:filter===f.key?"#fff":C.muted,
            border:"1px solid "+(filter===f.key?C.accent:C.border),borderRadius:20,padding:"6px 12px",fontSize:12,cursor:"pointer",
            fontWeight:filter===f.key?700:400,whiteSpace:"nowrap"}}>{f.lbl} <span style={{opacity:0.8}}>({f.count})</span></button>;
        })}
      </div>
      <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}><ExportBtn label="📥 Export Screener CSV" onClick={exportScreener}/></div>
      {filtered.length===0 && <div style={{...card({padding:30}),textAlign:"center",color:C.muted}}>कोई स्टॉक नहीं।</div>}
      {filtered.length>0 && <div style={card({overflow:"hidden"})}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,minWidth:700}}>
            <thead><tr style={{background:"#0a1626"}}>
              {["Stock","₹/buy","Status","Detail","Close",period+"D H",period+"D L","GTT","Avg","Target","Buys"].map(function(h){
                return <th key={h} style={{padding:"8px",textAlign:"left",color:C.muted,fontWeight:600,borderBottom:"1px solid "+C.border,whiteSpace:"nowrap",fontSize:10}}>{h}</th>;
              })}
            </tr></thead>
            <tbody>
              {filtered.map(function(r,i){
                var bg="transparent";
                if (r.status==="BUY_TODAY") bg="rgba(74,222,128,0.10)";
                else if (r.status==="TARGET_TODAY") bg="rgba(251,191,36,0.10)";
                else if (r.status==="NEW_LOW") bg="rgba(96,165,250,0.08)";
                else if (r.status==="GTT") bg="rgba(251,191,36,0.05)";
                else if (r.status==="HOLDING") bg="rgba(74,222,128,0.05)";
                var statusColor=C.muted;
                if (r.status==="BUY_TODAY"||r.status==="HOLDING") statusColor=C.buy;
                else if (r.status==="GTT"||r.status==="TARGET_TODAY") statusColor=C.gtt;
                else if (r.status==="NEW_LOW") statusColor="#60a5fa";
                return <tr key={i} style={{background:bg,borderBottom:"1px solid #0d1a2a",cursor:"pointer"}} onClick={function(){ onSelect(r.idx); }}>
                  <td style={{padding:"8px",color:"#93c5fd",fontWeight:600,whiteSpace:"nowrap"}}>{r.name}</td>
                  <td style={{padding:"8px",fontFamily:"monospace",color:C.muted,fontSize:10}}>{fmtRs(r.amount)}</td>
                  <td style={{padding:"8px",color:statusColor,fontWeight:700,fontSize:10,whiteSpace:"nowrap"}}>{r.label}</td>
                  <td style={{padding:"8px",color:C.muted,fontSize:10}}>{r.detail||"—"}</td>
                  <td style={{padding:"8px",fontFamily:"monospace",color:C.text}}>{fmtN(r.close)}</td>
                  <td style={{padding:"8px",fontFamily:"monospace",color:C.high}}>{fmtN(r.d20H)}</td>
                  <td style={{padding:"8px",fontFamily:"monospace",color:C.buy}}>{fmtN(r.d20L)}</td>
                  <td style={{padding:"8px",fontFamily:"monospace",color:C.gtt}}>{r.gtt!=null?fmtN(r.gtt):"—"}</td>
                  <td style={{padding:"8px",fontFamily:"monospace",color:"#93c5fd"}}>{r.avg!=null?fmtN(r.avg):"—"}</td>
                  <td style={{padding:"8px",fontFamily:"monospace",color:"#fbbf24"}}>{r.target!=null?fmtN(r.target):"—"}</td>
                  <td style={{padding:"8px",fontFamily:"monospace",color:C.muted,fontSize:10}}>{r.numBuys?r.numBuys+"/3":"—"}</td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>}
    </div>
  );
}

function exportTrades(stock){
  if (!stock) return;
  var rows=[["Stock","Buy#","Entry Date","Entry Price","Qty","Invested ₹","Target%","Exit Date","Exit Price","Shares","Proceeds ₹","Profit ₹","Days","Buys"]];
  (stock.trades||[]).forEach(function(t,i){
    // one row per buy leg + summary
    t.buys.forEach(function(b, bi){
      rows.push([stock.name, "B"+(bi+1), fmtDISODate(b.date), b.price.toFixed(2), b.qty, (b.price*b.qty).toFixed(0),
        ((t.targetPct||0)*100).toFixed(0),
        bi===0? fmtDISODate(t.exitDate):"", bi===0? t.exit.toFixed(2):"", bi===0? t.shares: "",
        bi===0? t.proceeds.toFixed(0):"", bi===0? t.pnl.toFixed(0):"", bi===0? t.days:"", bi===0? t.numBuys : ""]);
    });
  });
  downloadCSV("trades_"+stock.name.replace(/[^a-z0-9]/gi,"_")+"_"+dateStamp()+".csv", rows);
}
function exportTable(stock){
  if (!stock) return;
  var rows=[["Date","Open","High","Low","Close","Volume","20D Low","20D High","GTT Price","Event","Buy Price","Qty","Avg","Target"]];
  stock.rows.forEach(function(r){
    var ev=(r.events||[]).join(" | ");
    rows.push([fmtDISODate(r.date),
      r.open!=null?r.open.toFixed(2):"", r.high!=null?r.high.toFixed(2):"", r.low!=null?r.low.toFixed(2):"",
      r.close!=null?r.close.toFixed(2):"", r.vol||0,
      r.d20L!=null?r.d20L.toFixed(2):"", r.d20H!=null?r.d20H.toFixed(2):"",
      r.gttPrice!=null?r.gttPrice.toFixed(2):"", ev,
      r.buyPrice!=null?r.buyPrice.toFixed(2):"", r.buyQty!=null?r.buyQty:"",
      r.position?r.position.avgPrice.toFixed(2):"", r.position?r.position.target.toFixed(2):""]);
  });
  downloadCSV("signals_"+stock.name.replace(/[^a-z0-9]/gi,"_")+"_"+dateStamp()+".csv", rows);
}

function SettingsModal(props){
  var C=props.C;
  var per=React.useState(String(props.period)); var pv=per[0]; var setPv=per[1];
  var ep=React.useState(String(props.eps)); var ev=ep[0]; var setEv=ep[1];
  var amt=React.useState(String(props.fixedAmount)); var av=amt[0]; var setAv=amt[1];
  var ts=React.useState(props.targetSteps.map(function(x){ return String((x*100).toFixed(2)); }));
  var tv=ts[0]; var setTv=ts[1];
  var er=React.useState(""); var err=er[0]; var setErr=er[1];
  function save(){
    var p=parseInt(pv,10), e=parseFloat(ev), a=parseFloat(av);
    var steps = tv.map(function(x){ return parseFloat(x)/100; });
    if (!p||p<3||p>500) { setErr("Period 3-500"); return; }
    if (isNaN(e)||e<0||e>10) { setErr("EPS 0-10"); return; }
    if (!a||a<1000) { setErr("₹ per buy ≥ 1000"); return; }
    if (steps.some(function(x){ return isNaN(x)||x<=0||x>200; })) { setErr("Targets 0-200%"); return; }
    props.onSave(p, e, a, steps);
  }
  function reset(){
    setPv(String(DEFAULT_PERIOD)); setEv(String(DEFAULT_EPS));
    setAv(String(DEFAULT_FIXED_AMOUNT));
    setTv(DEFAULT_TARGETS.map(function(x){ return String((x*100).toFixed(2)); }));
    setErr("");
  }
  var inputStyle = { width:"100%", background:C.bg, border:"1px solid "+C.border, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:14, boxSizing:"border-box", outline:"none" };
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:110,padding:16}}
      onClick={function(e){ if (e.currentTarget===e.target) props.onClose(); }}>
      <div style={{background:"#0d1a2a",border:"1px solid "+C.border,borderRadius:14,padding:22,width:"100%",maxWidth:460,maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{fontWeight:700,fontSize:17,marginBottom:6,color:"#c4b5fd"}}>⚙️ Strategy Settings</div>
        <div style={{fontSize:11,color:C.muted,marginBottom:16,lineHeight:1.6}}>Rules: 20D Low → GTT @ 20D High · Targets 20/15/10% · Fixed ₹ per buy · Max 3 buys</div>

        <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>📅 Period (days)</label>
        <input type="number" min="3" max="500" value={pv} onChange={function(e){ setPv(e.target.value); }} style={Object.assign({},inputStyle,{marginBottom:10})}/>
        <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>📏 EPS Tolerance</label>
        <input type="number" step="0.01" min="0" max="10" value={ev} onChange={function(e){ setEv(e.target.value); }} style={Object.assign({},inputStyle,{marginBottom:10})}/>
        <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>💰 Fixed ₹ Per Buy (Rule 9)</label>
        <input type="number" step="1000" min="1000" value={av} onChange={function(e){ setAv(e.target.value); }} style={Object.assign({},inputStyle,{marginBottom:4})}/>
        <div style={{fontSize:10,color:C.muted,marginBottom:12}}>Max exposure per stock = ₹{inr((parseFloat(av)||0)*3)} (3 buys × ₹{inr(parseFloat(av)||0)})</div>

        <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>🎯 Target % — Buy 1 / 2 / 3 (Rules 5,6,7)</label>
        <div style={{display:"flex", gap:8, marginBottom:12}}>
          {tv.map(function(v,i){
            return <input key={i} type="number" step="0.5" min="0.1" value={v}
              onChange={function(e){ var copy=tv.slice(); copy[i]=e.target.value; setTv(copy); }}
              style={Object.assign({},inputStyle,{flex:1,padding:"8px 6px",textAlign:"center",fontSize:13})}/>;
          })}
        </div>
        <div style={{fontSize:10,color:C.muted,marginTop:-8,marginBottom:14}}>Default: 20 / 15 / 10</div>

        {err && <div style={{color:"#f87171",background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:8,padding:"8px 12px",fontSize:12,marginBottom:12}}>{err}</div>}
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <button onClick={props.onClose} style={{flex:1,background:C.border,color:C.text,border:"none",borderRadius:10,padding:12,fontSize:13,cursor:"pointer",minWidth:80}}>Cancel</button>
          <button onClick={reset} style={{flex:1,background:"#78350f",color:"#fde68a",border:"none",borderRadius:10,padding:12,fontSize:13,fontWeight:700,cursor:"pointer",minWidth:80}}>↺ Reset</button>
          <button onClick={save} style={{flex:2,background:"#7c3aed",color:"#fff",border:"none",borderRadius:10,padding:12,fontSize:14,fontWeight:700,cursor:"pointer",minWidth:100}}>💾 Save</button>
        </div>
      </div>
    </div>
  );
}

          </button>

      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.period>0 && s.eps>=0 && s.fixedAmount>0 && Array.isArray(s.targetSteps) && s.targetSteps.length===3) return s;
      }
    } catch(e) {}
    return { period: DEFAULT_PERIOD, eps: DEFAULT_EPS, fixedAmount: DEFAULT_FIXED_AMOUNT, targetSteps: DEFAULT_TARGETS.slice(), range: DEFAULT_RANGE };
  })();

  const perSt = React.useState(initSettings.period); var period = perSt[0]; var setPeriod = perSt[1];
  const epSt = React.useState(initSettings.eps); var eps = epSt[0]; var setEps = epSt[1];
  const amSt = React.useState(initSettings.fixedAmount); var fixedAmount = amSt[0]; var setFixedAmount = amSt[1];
  const tSt = React.useState(initSettings.targetSteps); var targetSteps = tSt[0]; var setTargetSteps = tSt[1];
  const soSt = React.useState(false); var settingsOpen = soSt[0]; var setSettingsOpen = soSt[1];

  function showToast(msg, type) { setToast({msg, type: type||"info"}); setTimeout(function(){ setToast(null); }, 3500); }

  function persistStocks(list){
    try {
      var slim = list.map(function(s){
        return {
          name: s.name, amount: s.amount || fixedAmount,
          sheetSuitable: s.sheetSuitable,
          rawRows: (s.rawRows||[]).map(function(r){
            return { date: r.date instanceof Date ? r.date.toISOString() : r.date, open: r.open, high: r.high, low: r.low, close: r.close, vol: r.vol, ts: r.ts };
          })
        };
      });
      localStorage.setItem(STOCKS_KEY, JSON.stringify(slim));
    } catch(e) {}
  }
  function persistSettings(p,e,a,steps,r){
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ period:p, eps:e, fixedAmount:a, targetSteps:steps, range:r })); } catch(err) {}
  }

  async function loadSheet(){
    setSheetInfo(function(prev){ return Object.assign({}, prev, { loading:true, error:null }); });
    try {
      const r = await fetchSheetStocks();
      setStockList(r.stocks);
      setSheetInfo({ loading:false, error:null, source:"sheet", hasBoh:r.hasBoh });
      showToast("✅ Sheet loaded: " + r.stocks.length + " stocks", "success");
    } catch (e) {
      console.error("Sheet fetch failed:", e);
      setStockList(FALLBACK_STOCKS.map(function(s){ return Object.assign({}, s, { bohText:"" }); }));
      setSheetInfo({ loading:false, error:e.message, source:"fallback", hasBoh:false });
      showToast("⚠ Sheet fail: " + e.message, "error");
    }
  }

  async function addStockAuto(stock){
    setLoadingSym(stock.sym);
    try {
      const r = await fetchFromYahoo(stock.sym, range);
      const parsed = parseCSV(r.csv, period);
      if (parsed.error) throw new Error(parsed.error);
      const rawRows = parsed.rows;
      const res = calcSignals(rawRows, period, eps, fixedAmount, targetSteps);
      const sheetSuitable = stock.suitable !== false;
      setStocks(function(p){
        const name = "NSE:" + stock.sym;
        const idx = p.findIndex(function(x){ return x.name === name; });
        const newStock = {
          name: name, amount: idx >= 0 ? p[idx].amount : fixedAmount,
          rawRows: rawRows,
          rows: res.rows, trades: res.trades,
          openPosition: res.openPosition, pendingGtt: res.pendingGtt,
          sheetSuitable: sheetSuitable
        };
        const next = idx >= 0 ? p.map(function(x,j){ return j===idx ? newStock : x; }) : p.concat([newStock]);
        setActive(idx >= 0 ? idx : next.length-1);
        persistStocks(next);
        return next;
      });
      showToast("✅ " + stock.sym + " loaded (" + res.trades.length + " trades)", "success");
      setLoadingSym(null);
      return true;
    } catch (e) {
      showToast("❌ " + stock.sym + ": " + e.message, "error");
      setLoadingSym(null);
      return false;
    }
  }
  async function pickFromList(stock){ const ok = await addStockAuto(stock); if (ok) setListOpen(false); }

  async function loadAllFromSheet(){
    const list = stockList;
    if (!list.length) { showToast("Sheet खाली है", "error"); return; }
    setAutoProgress({ done:0, total:list.length, current:"Starting..." });
    const allData = [];
    const BATCH_SIZE = 5;
    for (let i = 0; i < list.length; i += BATCH_SIZE) {
      const batch = list.slice(i, i + BATCH_SIZE);
      setAutoProgress({ done:i, total:list.length, current: batch.map(function(b){ return b.sym; }).join(", ") });
      const promises = batch.map(async function(st){
        try {
          const r = await fetchFromYahoo(st.sym, range);
          const parsed = parseCSV(r.csv, period);
          if (parsed.error) return null;
          return { sym: st.sym, name: st.name, suitable: st.suitable !== false, rawRows: parsed.rows };
        } catch (e) { return null; }
      });
      const results = await Promise.all(promises);
      results.forEach(function(r){ if (r) allData.push(r); });
      if (i + BATCH_SIZE < list.length) await new Promise(function(r){ setTimeout(r, 250); });
    }
    const newStocks = allData.map(function(d){
      const res = calcSignals(d.rawRows, period, eps, fixedAmount, targetSteps);
      return {
        name: "NSE:" + d.sym, amount: fixedAmount, rawRows: d.rawRows,
        rows: res.rows, trades: res.trades,
        openPosition: res.openPosition, pendingGtt: res.pendingGtt,
        sheetSuitable: d.suitable
      };
    });
    setStocks(function(prev){
      const merged = prev.slice();
      newStocks.forEach(function(ns){
        const idx = merged.findIndex(function(x){ return x.name === ns.name; });
        if (idx >= 0) merged[idx] = Object.assign({}, merged[idx], ns, { amount: merged[idx].amount });
        else merged.push(ns);
      });
      persistStocks(merged);
      return merged;
    });
    setAutoProgress(null);
    showToast("🚀 " + newStocks.length + "/" + list.length + " stocks loaded", "success");
    setListOpen(false);
    setActive(0);
  }

  async function bulkLoad(){
    var symbols = bulkTxt.split(/[\n,\s]+/).map(function(s){ return s.trim().toUpperCase().replace(/^NSE:/, ""); }).filter(Boolean);
    var unique = []; for (var i=0;i<symbols.length;i++) if (unique.indexOf(symbols[i])===-1) unique.push(symbols[i]);
    if (!unique.length) return;
    setBulkErrors([]);
    setBulkProg({current:0,total:unique.length,msg:"शुरू हो रहा है..."});
    var errs = [];
    for (var i2=0;i2<unique.length;i2++){
      var sym=unique[i2];
      setBulkProg({current:i2+1,total:unique.length,msg:sym+" fetch कर रहे हैं..."});
      try {
        var r = await fetchFromYahoo(sym, range);
        var parsed = parseCSV(r.csv, period);
        if (parsed.error) { errs.push(sym+": "+parsed.error); continue; }
        var res = calcSignals(parsed.rows, period, eps, fixedAmount, targetSteps);
        setStocks(function(p){
          var name="NSE:"+sym;
          var idx=p.findIndex(function(x){ return x.name===name; });
          var newStock={ name:name, amount: idx>=0?p[idx].amount:fixedAmount, rawRows:parsed.rows,
            rows:res.rows, trades:res.trades, openPosition:res.openPosition, pendingGtt:res.pendingGtt };
          var next = idx>=0 ? p.map(function(x,j){ return j===idx ? newStock : x; }) : p.concat([newStock]);
          persistStocks(next);
          return next;
        });
      } catch (e) { errs.push(sym+": "+e.message); }
      await new Promise(function(r){ setTimeout(r, 350); });
    }
    setBulkProg({current:unique.length,total:unique.length,msg:"पूरा हुआ ✅"});
    setBulkErrors(errs);
    setTimeout(function(){ setBulkProg({current:0,total:0,msg:""}); setBulkModal(false); setBulkTxt(""); }, 1500);
  }

  function handleAdd(csvRaw, lbl){
    setErr("");
    var parsed = parseCSV(csvRaw, period);
    if (parsed.error) { setErr(parsed.error); return false; }
    var res = calcSignals(parsed.rows, period, eps, fixedAmount, targetSteps);
    var name = (lbl && lbl.trim()) || parsed.stockName || ("Stock " + (stocks.length+1));
    setStocks(function(p){
      var next = p.concat([{ name:name, amount:fixedAmount, rawRows:parsed.rows,
        rows:res.rows, trades:res.trades, openPosition:res.openPosition, pendingGtt:res.pendingGtt }]);
      persistStocks(next);
      return next;
    });
    setActive(stocks.length);
    return true;
  }
  function submitAdd(){ if (handleAdd(csvTxt, label)) { setCsvTxt(""); setLabel(""); setModal(false); } }

  function updateAmount(idx, newAmount){
    setStocks(function(p){
      var copy = p.slice();
      if (!copy[idx]) return p;
      var s = copy[idx];
      var res = calcSignals(s.rawRows, period, eps, newAmount, targetSteps);
      copy[idx] = Object.assign({}, s, {
        amount: newAmount,
        rows: res.rows, trades: res.trades,
        openPosition: res.openPosition, pendingGtt: res.pendingGtt
      });
      persistStocks(copy);
      return copy;
    });
  }
  function removeStock(idx){
    setStocks(function(p){ var next=p.filter(function(_,i){ return i!==idx; }); persistStocks(next); return next; });
    setActive(function(a){ return Math.max(0, a>=idx ? a-1 : a); });
  }
  function clearAll(){
    if (!confirm("सारे loaded stocks हटा दें?")) return;
    setStocks([]); setActive(0);
    try { localStorage.removeItem(STOCKS_KEY); } catch(e) {}
    showToast("🗑 सारे stocks हटा दिए", "success");
  }
  function onFile(e){ var f=e.target.files&&e.target.files[0]; if (!f) return; var rd=new FileReader(); rd.onload=function(ev){ setCsvTxt(ev.target.result); }; rd.readAsText(f); }

  function applySettings(newPeriod, newEps, newAmount, newTargetSteps){
    setPeriod(newPeriod); setEps(newEps); setFixedAmount(newAmount); setTargetSteps(newTargetSteps);
    persistSettings(newPeriod, newEps, newAmount, newTargetSteps, range);
    setStocks(function(prev){
      const next = prev.map(function(s){
        if (!s.rawRows || s.rawRows.length < newPeriod) return s;
        var res = calcSignals(s.rawRows, newPeriod, newEps, s.amount || newAmount, newTargetSteps);
        return Object.assign({}, s, { rows:res.rows, trades:res.trades, openPosition:res.openPosition, pendingGtt:res.pendingGtt });
      });
      persistStocks(next);
      return next;
    });
    setSettingsOpen(false);
    showToast("⚙️ Settings saved", "success");
  }

    } catch(e) {}

    try {

        var list = JSON.parse(rawS);

          var rawRows = (s.rawRows||[]).map(function(r){ return Object.assign({}, r, { date:new Date(r.date) }); });
          var amt = s.amount || fixedAmount;
          var res = calcSignals(rawRows, period, eps, amt, targetSteps);
          return { name:s.name, amount:amt, sheetSuitable:s.sheetSuitable, rawRows:rawRows,

        if (restored.length) { setStocks(restored); setActive(0); showToast("♻ "+restored.length+" stocks restored","success"); }
      }
    } catch(e) {}

    loadSheet();
  }, []);

                <span>Avg: <b style={{color:"#93c5fd"}}>₹{fmtN(s.openPosition.avgPrice)}</b> × <b>{s.openPosition.shares}</b></span>
                <span>Invested: <b style={{color:"#93c5fd"}}>{fmtRs(s.openPosition.cost)}</b></span>
                <span>Target: <b style={{color:C.gtt}}>₹{fmtN(s.openPosition.target)}</b></span>
                <span>Potential: <b style={{color:C.buy}}>+{fmtRs(s.openPosition.shares*s.openPosition.target - s.openPosition.cost)}</b></span>
              </div>
            </div>
          )}

          <div style={{ display:"flex", flexDirection:"column", gap:8, paddingTop:10, borderTop:"1px solid "+C.border }}>
            <AmountSizer amount={s.amount||fixedAmount} onChange={function(a){ updateAmount(active, a); }} C={C}/>
          </div>
        </div>}

        <div style={{ padding:"0 16px 12px", display:"flex", gap:6, overflowX:"auto" }}>
          {views.map(function(v){
            return <button key={v.key} onClick={function(){ setView(v.key); }} style={{ background: view===v.key ? C.accent : "none", color: view===v.key ? "#fff" : C.muted, border:"1px solid "+(view===v.key ? C.accent : C.border), borderRadius:8, padding:"6px 12px", fontSize:12, cursor:"pointer", fontWeight: view===v.key ? 700 : 400, whiteSpace:"nowrap" }}>{v.lbl}</button>;
          })}
        </div>

        {view==="chart" && <div style={{ padding:"0 10px 20px" }}>
          <div style={card({ padding:"10px 0" })}>
            <div style={{ paddingLeft:14, paddingRight:14, fontSize:12, color:C.muted, marginBottom:6, display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
              <span style={{flex:1}}>{s.name} — {chartType==="candle"?"Candlestick":"Line"} + {period}D Bands</span>
              <div style={{display:"flex", gap:4}}>
                <button onClick={function(){ setChartType("candle"); }} style={{ background: chartType==="candle" ? C.accent : "none", color: chartType==="candle" ? "#fff" : C.muted, border:"1px solid "+(chartType==="candle" ? C.accent : C.border), borderRadius:6, padding:"4px 10px", fontSize:11, cursor:"pointer", fontWeight: chartType==="candle" ? 700 : 400 }}>🕯</button>
                <button onClick={function(){ setChartType("line"); }} style={{ background: chartType==="line" ? C.accent : "none", color: chartType==="line" ? "#fff" : C.muted, border:"1px solid "+(chartType==="line" ? C.accent : C.border), borderRadius:6, padding:"4px 10px", fontSize:11, cursor:"pointer", fontWeight: chartType==="line" ? 700 : 400 }}>📈</button>
              </div>
            </div>
            <MiniChart rows={s.rows} chartType={chartType} period={period}/>
          </div>
        </div>}

        {view==="trades" && <div style={{ padding:"0 16px 20px", display:"flex", flexDirection:"column", gap:8 }}>
          <div style={{display:"flex", gap:6, flexWrap:"wrap", alignItems:"center"}}>
            <ExportBtn label="📥 Export Trades CSV" onClick={function(){ exportTrades(s); }}/>
          </div>
          {s.trades.length===0 && !s.openPosition && <div style={{ color:C.muted, textAlign:"center", padding:40 }}>कोई closed trade नहीं।</div>}
          {s.trades.map(function(t,i){
            return <div key={i} style={{ background:"#04130b", border:"1px solid #166534", borderRadius:10, padding:"10px 14px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8, flexWrap:"wrap", gap:6 }}>
                <span style={{ color:"#86efac", fontWeight:700, fontSize:13 }}>#{s.trades.length-i} — {fmtD(t.entryDate)} → {fmtD(t.exitDate)} · {t.numBuys} buy{t.numBuys>1?"s":""}</span>
                <span style={{ background:"#052e16", color:C.buy, border:"1px solid #166534", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>🎯 +{t.pct.toFixed(2)}% · {fmtRs(t.pnl)}</span>
              </div>
              {t.buys.map(function(b, bi){
                return <div key={bi} style={{ display:"flex", gap:10, fontSize:11, color:"#94a3b8", flexWrap:"wrap", marginBottom:3 }}>
                  <span style={{ color: bi===0?C.buy:bi===1?C.buy2:C.buy3, fontWeight:700, minWidth:50 }}>B{bi+1}</span>
                  <span>{fmtD(b.date)}</span>
                  <span>₹{fmtN(b.price)} × {b.qty} = {fmtRs(b.price*b.qty)}</span>
                </div>;
              })}
              <div style={{ display:"flex", gap:16, fontSize:12, color:"#94a3b8", flexWrap:"wrap", marginTop:6, paddingTop:6, borderTop:"1px dashed #166534" }}>
                <span>Avg ₹{fmtN(t.cost/t.shares)}</span>
                <span>Exit ₹{fmtN(t.exit)} × {t.shares} = <b style={{color:"#93c5fd"}}>{fmtRs(t.proceeds)}</b></span>
                <span>Cost: <b style={{color:"#93c5fd"}}>{fmtRs(t.cost)}</b></span>
                <span style={{color:C.buy, fontWeight:700}}>P&L: +{fmtRs(t.pnl)}</span>
                <span>Held: <b>{t.days}</b>d</span>
                <span>Target: {(t.targetPct*100).toFixed(0)}%</span>
              </div>
            </div>;
          })}
          {s.openPosition && <div style={{ background:"#1c1407", border:"1px solid #78350f", borderRadius:10, padding:"10px 14px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:8 }}>
              <span style={{ color:"#fde68a", fontWeight:700, fontSize:13 }}>OPEN — {fmtD(s.openPosition.entryDate)} · {s.openPosition.numBuys}/3 buys</span>
              <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>{s.openPosition.targetPct*100}% target</span>
            </div>
            {s.openPosition.buys.map(function(b, bi){
              return <div key={bi} style={{ display:"flex", gap:10, fontSize:11, color:"#94a3b8", flexWrap:"wrap", marginBottom:3 }}>
                <span style={{ color: bi===0?C.buy:bi===1?C.buy2:C.buy3, fontWeight:700, minWidth:50 }}>B{bi+1}</span>
                <span>{fmtD(b.date)}</span>
                <span>₹{fmtN(b.price)} × {b.qty} = {fmtRs(b.price*b.qty)}</span>
              </div>;
            })}
            <div style={{ display:"flex", gap:16, fontSize:12, color:"#94a3b8", flexWrap:"wrap", marginTop:6, paddingTop:6, borderTop:"1px dashed #78350f" }}>
              <span>Avg ₹{fmtN(s.openPosition.avgPrice)} × {s.openPosition.shares}</span>
              <span>Invested: <b style={{color:"#93c5fd"}}>{fmtRs(s.openPosition.cost)}</b></span>
              <span>Target: <b style={{color:C.gtt}}>₹{fmtN(s.openPosition.target)}</b></span>
              <span style={{color:C.buy, fontWeight:700}}>Potential: +{fmtRs(s.openPosition.shares*s.openPosition.target - s.openPosition.cost)}</span>
            </div>
          </div>}
        </div>}

        {view==="log" && <div style={{ padding:"0 16px 20px", display:"flex", flexDirection:"column", gap:8 }}>
          {events.length===0 && <div style={{ color:C.muted, textAlign:"center", padding:40 }}>कोई event नहीं।</div>}
          {events.map(function(r,i){
            return <div key={i} style={{ background: r.events.includes("target") ? "#120d00" : (r.events.some(function(e){return /^buy/.test(e);})) ? "#04130b" : C.card, border: "1px solid " + (r.events.includes("target") ? "#78350f" : (r.events.some(function(e){return /^buy/.test(e);})) ? "#166534" : C.border), borderRadius:10, padding:"10px 14px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6, flexWrap:"wrap", gap:6 }}>
                <span style={{ color:C.dim, fontWeight:700, fontSize:13, fontFamily:"monospace" }}>{fmtD(r.date)}</span>
                <span style={{ display:"flex", gap:6 }}>
                  {r.events.includes("gtt-placed") && <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>🔔 GTT</span>}
                  {r.events.includes("buy") && <span style={{ background:"#052e16", color:C.buy, border:"1px solid #166534", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>✅ B1</span>}
                  {r.events.includes("buy2") && <span style={{ background:"#082f49", color:C.buy2, border:"1px solid #0369a1", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>✅ B2</span>}
                  {r.events.includes("buy3") && <span style={{ background:"#500724", color:C.buy3, border:"1px solid #9d174d", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>✅ B3</span>}
                  {r.events.includes("target") && <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>🎯 TARGET</span>}
                </span>
              </div>
              <div style={{ display:"flex", gap:20, fontSize:12, color:"#94a3b8", flexWrap:"wrap" }}>
                <span>H: ₹{fmtN(r.high)}</span><span>L: ₹{fmtN(r.low)}</span><span>C: ₹{fmtN(r.close)}</span>
                {r.gttPrice && <span>GTT @ <b style={{color:C.gtt}}>₹{fmtN(r.gttPrice)}</b></span>}
                {r.buyPrice && <span>Buy @ <b style={{color:C.buy}}>₹{fmtN(r.buyPrice)}</b> × {r.buyQty}</span>}
                {r.position && <span>Avg ₹{fmtN(r.position.avgPrice)} · T ₹{fmtN(r.position.target)} · {r.position.buys}/3</span>}
              </div>
            </div>;
          })}
        </div>}

        {view==="table" && <div style={{ padding:"0 0 20px" }}>
          <div style={{padding:"0 16px 8px"}}><ExportBtn label="📥 Export Table" onClick={function(){ exportTable(s); }}/></div>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
              <thead><tr style={{ background:C.card }}>
                {["Date","Close",period+"D L",period+"D H","GTT","Buy","Qty","Avg","Target","Event"].map(function(h){
                  return <th key={h} style={{ padding:"8px", textAlign:["Date","Event"].indexOf(h)>=0?"left":"right", color:C.muted, fontWeight:600, borderBottom:"1px solid "+C.border, whiteSpace:"nowrap", fontSize:10 }}>{h}</th>;
                })}
              </tr></thead>
              <tbody>
                {s.rows.slice().reverse().map(function(r,i){
                  var isB = r.events && r.events.some(function(e){ return /^buy/.test(e); });
                  var isT = r.events && r.events.includes("target");
                  var isG = r.events && r.events.includes("gtt-placed");
                  var bg = isT ? C.gttBg : isB ? C.buyBg : "transparent";
                  return <tr key={i} style={{ background: bg, borderBottom:"1px solid #0d1a2a" }}>
                    <td style={{ padding:"6px 8px", color:C.dim, whiteSpace:"nowrap", fontFamily:"monospace", fontSize:10 }}>{fmtD(r.date)}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", fontWeight:600, fontFamily:"monospace" }}>{fmtN(r.close)}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:C.low, fontFamily:"monospace" }}>{r.d20L ? fmtN(r.d20L) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:C.high, fontFamily:"monospace" }}>{r.d20H ? fmtN(r.d20H) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:C.gtt, fontFamily:"monospace" }}>{r.gttPrice ? fmtN(r.gttPrice) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:C.buy, fontFamily:"monospace" }}>{r.buyPrice ? fmtN(r.buyPrice) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", fontFamily:"monospace", color:"#93c5fd" }}>{r.buyQty || "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", fontFamily:"monospace", color:"#93c5fd" }}>{r.position ? fmtN(r.position.avgPrice) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:"#fbbf24", fontFamily:"monospace" }}>{r.position ? fmtN(r.position.target) : "—"}</td>
                    <td style={{ padding:"6px 8px", fontSize:10, whiteSpace:"nowrap" }}>
                      {isG && <span style={{ color:C.gtt, marginRight:6 }}>🔔</span>}
                      {r.events && r.events.includes("buy") && <span style={{ color:C.buy, marginRight:6 }}>B1</span>}
                      {r.events && r.events.includes("buy2") && <span style={{ color:C.buy2, marginRight:6 }}>B2</span>}
                      {r.events && r.events.includes("buy3") && <span style={{ color:C.buy3, marginRight:6 }}>B3</span>}
                      {isT && <span style={{ color:C.gtt }}>🎯</span>}
                    </td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
        </div>}

        {view==="screener" && <ScreenerView stocks={stocks} period={period} onSelect={function(i){ setActive(i); setView("chart"); }}/>}
        {view==="portfolio" && <PortfolioView stocks={stocks} onSelect={function(i){ setActive(i); setView("chart"); }}/>}
      </div>}

      {listOpen && <StocksListModal
        onClose={function(){ setListOpen(false); }}
        onPick={pickFromList}
        loadingSym={loadingSym}
        loadAll={loadAllFromSheet}
        autoProgress={autoProgress}
        stockList={stockList}
        sheetInfo={sheetInfo}
        reloadSheet={loadSheet}
        period={period}
        targetSteps={targetSteps}
        fixedAmount={fixedAmount}
        hasBohCol={sheetInfo.hasBoh}
      />}

      {modal && <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.8)", display:"flex", alignItems:"flex-end", zIndex:100 }}
        onClick={function(e){ if (e.currentTarget===e.target) { setModal(false); setErr(""); } }}>
        <div style={{ background:"#0d1a2a", borderTop:"1px solid "+C.border, borderRadius:"18px 18px 0 0", padding:20, width:"100%", maxHeight:"90vh", overflowY:"auto" }}>
          <div style={{ fontWeight:700, fontSize:16, marginBottom:18 }}>📥 Stock Add</div>
          <label style={{ fontSize:12, color:C.muted, display:"block", marginBottom:4 }}>📥 Yahoo से</label>
          <input list="nifty200-list" value={label} onChange={function(e){ setLabel(e.target.value); }} placeholder="Stock"
            style={{ width:"100%", background:C.bg, border:"1px solid "+C.border, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:14, boxSizing:"border-box", marginBottom:10, outline:"none" }}/>
          <datalist id="nifty200-list">{NIFTY200.map(function(sym){ return <option key={sym} value={sym}/>; })}</datalist>
          <button onClick={async function(){
            if (!label.trim()) { setErr("पहले stock चुनें"); return; }
            setErr(""); setLoadingSym(label);
            const ok = await addStockAuto({ sym: label.trim() });
            setLoadingSym(null);
            if (ok) { setLabel(""); setModal(false); }
            else setErr("❌ " + label + " load नहीं हो पाया");
          }} disabled={!!loadingSym}
            style={{ width:"100%", background:"#2563eb", color:"#fff", border:"none", borderRadius:8, padding:11, fontSize:14, fontWeight:700, cursor:"pointer", marginBottom:14, opacity: loadingSym ? 0.6 : 1 }}>
            {loadingSym ? "⏳ " + loadingSym + "..." : "📥 Load"}
          </button>
          <div style={{ textAlign:"center", fontSize:11, color:C.muted, marginBottom:12 }}>─── या manual CSV ───</div>
          <input type="file" accept=".csv,.txt" onChange={onFile}
            style={{ width:"100%", background:C.bg, border:"1px solid "+C.border, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:13, boxSizing:"border-box", marginBottom:10 }}/>
          <textarea value={csvTxt} onChange={function(e){ setCsvTxt(e.target.value); }} rows={4}
            placeholder={"Date,Open,High,Low,Close,Volume"}
            style={{ width:"100%", background:C.bg, border:"1px solid "+C.border, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:11, fontFamily:"monospace", resize:"vertical", boxSizing:"border-box", marginBottom:10, outline:"none" }}/>
          {err && <div style={{ color:"#f87171", background:"rgba(239,68,68,.1)", border:"1px solid rgba(239,68,68,.3)", borderRadius:8, padding:"8px 12px", fontSize:12, marginBottom:12 }}>{err}</div>}
          <div style={{ display:"flex", gap:10 }}>
            <button onClick={function(){ setModal(false); setErr(""); setCsvTxt(""); setLabel(""); }}
              style={{ flex:1, background:C.border, color:C.text, border:"none", borderRadius:10, padding:12, fontSize:14, cursor:"pointer" }}>Cancel</button>
            <button onClick={submitAdd}
              style={{ flex:2, background:C.accent, color:"#fff", border:"none", borderRadius:10, padding:12, fontSize:14, fontWeight:700, cursor:"pointer" }}>✅ Manual CSV</button>
          </div>
        </div>
      </div>}

      {bulkModal && <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.8)", display:"flex", alignItems:"flex-end", zIndex:100 }}
        onClick={function(e){ if (e.currentTarget===e.target && !bulkProg.total) setBulkModal(false); }}>
        <div style={{ background:"#0d1a2a", borderTop:"1px solid "+C.border, borderRadius:"18px 18px 0 0", padding:20, width:"100%", maxHeight:"90vh", overflowY:"auto" }}>
          <div style={{ fontWeight:700, fontSize:16, marginBottom:6, color:"#c4b5fd" }}>⚡ Bulk Add</div>
          <div style={{ fontSize:11, color:C.muted, marginBottom:14 }}>Symbols एक-एक लाइन पर या comma से</div>
          <textarea value={bulkTxt} onChange={function(e){ setBulkTxt(e.target.value); }} rows={6}
            placeholder={"RELIANCE\nTCS\nINFY\nHDFCBANK"}
            disabled={!!bulkProg.total}
            style={{ width:"100%", background:C.bg, border:"1px solid "+C.border, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:12, fontFamily:"monospace", resize:"vertical", boxSizing:"border-box", marginBottom:10, outline:"none", opacity: bulkProg.total ? 0.5 : 1 }}/>
          {bulkProg.total > 0 && <div style={{ background:"#1e1b4b", border:"1px solid #7c3aed", borderRadius:8, padding:"10px 12px", fontSize:12, marginBottom:12 }}>
            <div style={{color:"#c4b5fd",fontWeight:700,marginBottom:6}}>Progress: {bulkProg.current}/{bulkProg.total}</div>
            <div style={{background:"#0d1a2a",borderRadius:4,height:8,overflow:"hidden",marginBottom:6}}>
              <div style={{background:"#7c3aed",height:"100%",width:(bulkProg.current/bulkProg.total*100)+"%",transition:"width 0.3s"}}/>
            </div>
            <div style={{color:C.muted,fontSize:11}}>{bulkProg.msg}</div>
          </div>}
          {bulkErrors.length > 0 && <div style={{ background:"rgba(239,68,68,.1)", border:"1px solid rgba(239,68,68,.3)", borderRadius:8, padding:"10px 12px", fontSize:11, marginBottom:12, color:"#fca5a5", maxHeight:150, overflowY:"auto" }}>
            <div style={{fontWeight:700, marginBottom:6}}>⚠️ Failed:</div>
            {bulkErrors.map(function(e, i){ return <div key={i}>• {e}</div>; })}
          </div>}
          <div style={{ display:"flex", gap:10 }}>
            <button onClick={function(){ if (!bulkProg.total) { setBulkModal(false); setBulkErrors([]); } }}
              disabled={!!bulkProg.total}
              style={{ flex:1, background:C.border, color:C.text, border:"none", borderRadius:10, padding:12, fontSize:14, cursor: bulkProg.total ? "not-allowed" : "pointer", opacity: bulkProg.total ? 0.5 : 1 }}>Cancel</button>
            <button onClick={bulkLoad}
              disabled={!!bulkProg.total || !bulkTxt.trim()}
              style={{ flex:2, background:"#7c3aed", color:"#fff", border:"none", borderRadius:10, padding:12, fontSize:14, fontWeight:700, cursor: bulkProg.total ? "not-allowed" : "pointer", opacity: (bulkProg.total || !bulkTxt.trim()) ? 0.5 : 1 }}>
              {bulkProg.total ? "⏳ " + bulkProg.current + "/" + bulkProg.total : "⚡ Load"}
            </button>
          </div>
        </div>
      </div>}

      {settingsOpen && <SettingsModal C={C} period={period} eps={eps} fixedAmount={fixedAmount} targetSteps={targetSteps}
        onClose={function(){ setSettingsOpen(false); }} onSave={applySettings}/>}

      {toast && <div style={{
        position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",
        background: toast.type==="error" ? "#7f1d1d" : "#052e16",
        color: toast.type==="error" ? "#fecaca" : "#86efac",
        border:"1px solid "+(toast.type==="error"?"#991b1b":"#166534"),
        borderRadius:10,padding:"10px 18px",fontSize:13,fontWeight:600,
        zIndex:999,boxShadow:"0 10px 30px rgba(0,0,0,.5)",maxWidth:"90vw"
      }}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
