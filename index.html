function fmtD(d) {
  if (!d) return "—";
  return d.toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"2-digit" });
}
function fmtN(v, dec) {
  if (v == null || isNaN(v)) return "—";
  return Number(v).toFixed(dec == null ? 2 : dec);
}

function parseDateCell(s) {
  if (s == null) return null;
  const str = String(s).trim();
  if (!str) return null;
  if (str.indexOf("/") === -1 && str.indexOf("-") === -1 && str.indexOf(":") === -1) {
    const n = parseFloat(str);
    if (!isNaN(n) && n > 25000 && n < 100000) {
      const ms = (n - 25569) * 86400 * 1000;
      const d = new Date(ms);
      if (!isNaN(d.getTime())) return d;
    }
  }
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

async function fetchViaProxy(url) {
  const proxies = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://api.cors.lol/?url=" + encodeURIComponent(url),
    "https://thingproxy.freeboard.io/fetch/" + url,
    "https://proxy.cors.sh/" + url
  ];
  let lastErr = "";
  for (let i = 0; i < proxies.length; i++) {
    try {
      const res = await fetch(proxies[i]);
      if (!res.ok) { lastErr = "HTTP " + res.status; continue; }
      const text = await res.text();
      if (text && text.length > 20) return text;
    } catch (e) { lastErr = e.message; }
  }
  throw new Error("Data नहीं मिला (" + lastErr + ")");
}

async function fetchFromYahoo(sym) {
  const clean = String(sym).toUpperCase().replace(/^NSE:/, "").trim();
  const ySym = clean + ".NS";
  const yUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + ySym + "?interval=1d&range=1y";
  const text = await fetchViaProxy(yUrl);
  let json;
  try { json = JSON.parse(text); } catch (e) { throw new Error("Yahoo response गलत"); }
  const r = json && json.chart && json.chart.result && json.chart.result[0];
  if (!r) throw new Error("Symbol गलत है या NSE पर listed नहीं");
  const ts = r.timestamp || [];
  const q = (r.indicators && r.indicators.quote && r.indicators.quote[0]) || {};
  const lines = ["Date,Open,High,Low,Close,Volume"];
  for (let i = 0; i < ts.length; i++) {
    const d = new Date(ts[i] * 1000);
    const ds = (d.getMonth()+1) + "/" + d.getDate() + "/" + d.getFullYear();
    const o = q.open ? q.open[i] : null;
    const h = q.high ? q.high[i] : null;
    const l = q.low ? q.low[i] : null;
    const c = q.close ? q.close[i] : null;
    const v = q.volume ? q.volume[i] : 0;
    if (o == null || h == null || l == null || c == null) continue;
    lines.push(ds + "," + o + "," + h + "," + l + "," + c + "," + (v || 0));
  }
  if (lines.length < 21) throw new Error("कम data मिला");
  return { csv: lines.join("\n"), name: "NSE:" + clean };
}

async function fetchFromSheet(url) {
  const trimmed = url.trim();
  try {
    const direct = await fetch(trimmed);
    if (direct.ok) {
      const text = await direct.text();
      if (text && text.length > 20) {
        try {
          const json = JSON.parse(text);
          if (Array.isArray(json) && json.length > 1) {
            const lines = json.map(function(row){
              return (Array.isArray(row) ? row : [row]).map(function(cell){
                if (cell == null) return "";
                const s = String(cell);
                return s.indexOf(",") >= 0 ? '"' + s.replace(/"/g, '""') + '"' : s;
              }).join(",");
            });
            if (lines.join("\n").indexOf("Date") !== -1) {
              return { csv: lines.join("\n"), name: "" };
            }
          }
        } catch (e) {}
        if (text.indexOf("Date") !== -1) return { csv: text, name: "" };
      }
    }
  } catch (e) {}
  const text = await fetchViaProxy(trimmed);
  if (!text || text.length < 20) throw new Error("खाली response मिला");
  try {
    const json = JSON.parse(text);
    if (Array.isArray(json) && json.length > 1) {
      const lines = json.map(function(row){
        return (Array.isArray(row) ? row : [row]).map(function(cell){
          if (cell == null) return "";
          const s = String(cell);
          return s.indexOf(",") >= 0 ? '"' + s.replace(/"/g, '""') + '"' : s;
        }).join(",");
      });
      if (lines.join("\n").indexOf("Date") !== -1) {
        return { csv: lines.join("\n"), name: "" };
      }
    }
  } catch (e) {}
  if (text.indexOf("Date") === -1) throw new Error("Sheet में Date column नहीं मिला।");
  return { csv: text, name: "" };
}

function parseCSV(raw) {
  if (!raw || !raw.trim()) return { error: "CSV खाली है।" };
  const lines = raw.trim().split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
  let stockName = "", hIdx = -1;
  for (let i = 0; i < Math.min(lines.length, 12); i++) {
    if (/^date/i.test(lines[i])) { hIdx = i; break; }
    const p = lines[i].split(",");
    const cell = p[0] ? p[0].trim() : "";
    if (cell && !/^\d/.test(cell) && !/\*/.test(cell) && cell.length > 1 && cell.toUpperCase() !== "STOCK") stockName = cell;
  }
  if (hIdx === -1) return { error: 'Header row "Date,Open,High,Low,Close" नहीं मिला।' };
  const hdr = lines[hIdx].split(",").map(function(h){ return h.trim().toLowerCase(); });
  const gi = function() {
    for (let j = 0; j < arguments.length; j++) {
      const x = hdr.indexOf(arguments[j]);
      if (x >= 0) return x;
    }
    return -1;
  };
  const di=gi("date","datetime","time"), oi=gi("open"), hi=gi("high"), li=gi("low"), ci=gi("close"), vi=gi("volume","vol");
  if ([di,hi,li].some(function(x){ return x < 0; })) return { error: "Date / High / Low columns नहीं मिले।" };
  const rows = [];
  for (let i = hIdx+1; i < lines.length; i++) {
    const p = lines[i].split(",");
    if (p.length < 4) continue;
    const ds = p[di] ? p[di].trim() : "";
    if (!ds) continue;
    const d = parseDateCell(ds);
    if (!d) continue;
    const high  = parseFloat(p[hi]);
    const low   = parseFloat(p[li]);
    const close = ci>=0 ? parseFloat(p[ci]) : high;
    const open  = oi>=0 ? parseFloat(p[oi]) : close;
    const vol   = vi>=0 ? (parseInt(p[vi])||0) : 0;
    if (isNaN(high) || isNaN(low)) continue;
    rows.push({ date: d, open: open, high: high, low: low, close: close, vol: vol, ts: d.getTime() });
  }
  rows.sort(function(a,b){ return a.ts - b.ts; });
  if (rows.length < PERIOD) return { error: "कम से कम " + PERIOD + " rows चाहिए। मिले: " + rows.length };
  return { stockName: stockName, rows: rows };
}

function calcSignals(rows) {
  const enriched = rows.map(function(r, i) {
    if (i < PERIOD - 1) return Object.assign({}, r, { d20L: null, d20H: null, prevD20H: null, newLow: false, events: [], gttPrice: null });
    const win = rows.slice(i - PERIOD + 1, i + 1);
    const d20L = Math.min.apply(null, win.map(function(x){ return x.low; }));
    const d20H = Math.max.apply(null, win.map(function(x){ return x.high; }));
    return Object.assign({}, r, { d20L: d20L, d20H: d20H, prevD20H: null, newLow: r.low <= d20L + EPS, events: [], gttPrice: null });
  });
  for (let i = 1; i < enriched.length; i++) {
    if (enriched[i-1].d20H != null) enriched[i].prevD20H = enriched[i-1].d20H;
  }
  let state = "IDLE";
  let entryPrice = null, entryDate = null, entryIdx = -1, targetPrice = null;
  const trades = [];
  for (let i = 0; i < enriched.length; i++) {
    const r = enriched[i];
    if (r.d20H == null) continue;
    if (state === "IN_POSITION") {
      r.position = { entry: entryPrice, entryDate: entryDate, target: targetPrice };
      if (r.high >= targetPrice - EPS) {
        r.events.push("target");
        trades.push({ entryDate: entryDate, entry: entryPrice, exitDate: r.date, exit: targetPrice, days: i - entryIdx, pct: TARGET_PCT * 100 });
        state = "IDLE"; entryPrice = null; entryDate = null; entryIdx = -1; targetPrice = null;
      }
      continue;
    }
    if (state === "GTT_ACTIVE") {
      const gttToday = r.prevD20H;
      if (gttToday != null && r.high >= gttToday - EPS) {
        r.events.push("buy");
        r.gttPrice = gttToday;
        entryPrice = gttToday; entryDate = r.date; entryIdx = i;
        targetPrice = entryPrice * (1 + TARGET_PCT);
        if (r.high >= targetPrice - EPS) {
          r.events.push("target");
          trades.push({ entryDate: entryDate, entry: entryPrice, exitDate: r.date, exit: targetPrice, days: 0, pct: TARGET_PCT * 100 });
          state = "IDLE"; entryPrice = null; entryDate = null; entryIdx = -1; targetPrice = null;
        } else {
          state = "IN_POSITION";
        }
      } else {
        r.gttPrice = r.d20H;
      }
      continue;
    }
    if (r.newLow) {
      state = "GTT_ACTIVE";
      r.events.push("gtt-placed");
      r.gttPrice = r.d20H;
    }
  }
  let openPosition = null, pendingGtt = null;
  if (state === "IN_POSITION") {
    openPosition = { entry: entryPrice, entryDate: entryDate, target: targetPrice, entryIdx: entryIdx };
  } else if (state === "GTT_ACTIVE") {
    const last = enriched[enriched.length - 1];
    pendingGtt = { price: last.d20H, date: last.date };
  }
  return { rows: enriched, trades: trades, openPosition: openPosition, pendingGtt: pendingGtt };
}

function calcPortfolioStats(stocks) {
  if (!stocks || !stocks.length) return null;
  var totalTrades = 0, wins = 0, losses = 0, grossWin = 0, grossLoss = 0;
  var heldDays = 0, openCount = 0, gttCount = 0, idleCount = 0;
  var perStock = [];
  for (var i = 0; i < stocks.length; i++) {
    var s = stocks[i];
    var t = s.trades || [];
    var w = 0, l = 0, sw = 0, sl = 0, d = 0;
    for (var j = 0; j < t.length; j++) {
      var tr = t[j];
      if (tr.pct > 0) { w++; sw += tr.pct; }
      else { l++; sl += Math.abs(tr.pct); }
      d += (tr.days || 0);
    }
    totalTrades += t.length; wins += w; losses += l;
    grossWin += sw; grossLoss += sl; heldDays += d;
    var status = s.openPosition ? "HOLDING" : (s.pendingGtt ? "GTT" : "IDLE");
    if (s.openPosition) openCount++;
    else if (s.pendingGtt) gttCount++;
    else idleCount++;
    var lastRow = s.rows && s.rows.length ? s.rows[s.rows.length - 1] : null;
    perStock.push({
      name: s.name, trades: t.length, wins: w, losses: l,
      winRate: t.length ? (w / t.length) * 100 : 0,
      avgWin: w ? sw / w : 0,
      avgLoss: l ? sl / l : 0,
      netPct: sw - sl, status: status,
      lastClose: lastRow ? lastRow.close : null
    });
  }
  var winRate = totalTrades ? (wins / totalTrades) * 100 : 0;
  var avgWin = wins ? grossWin / wins : 0;
  var avgLoss = losses ? grossLoss / losses : 0;
  var profitFactor = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0);
  var expectancy = totalTrades ? ((wins / totalTrades) * avgWin - (losses / totalTrades) * avgLoss) : 0;
  return {
    totalStocks: stocks.length, totalTrades: totalTrades,
    wins: wins, losses: losses, winRate: winRate,
    avgWin: avgWin, avgLoss: avgLoss,
    grossWin: grossWin, grossLoss: grossLoss,
    netPct: grossWin - grossLoss,
    profitFactor: profitFactor, expectancy: expectancy,
    openCount: openCount, gttCount: gttCount, idleCount: idleCount,
    avgHeldDays: totalTrades ? heldDays / totalTrades : 0,
    perStock: perStock
  };
}

function MiniChart(props) {
  var rows = props.rows;
  var chartType = props.chartType || "candle";
  var height = props.height || 320;
  var hov = React.useState(null); var hover = hov[0]; var setHover = hov[1];
  var W = 800, H = height, PAD = { l:50, r:10, t:20, b:30 };
  var iw = W - PAD.l - PAD.r;
  var ih = H - PAD.t - PAD.b;
  var data = rows.filter(function(r){ return r.d20H != null; });
  if (!data.length) return null;

  var allVals = [];
  data.forEach(function(r){ allVals.push(r.close, r.d20H, r.d20L, r.high, r.low); });
  var minV = Math.min.apply(null, allVals);
  var maxV = Math.max.apply(null, allVals);
  var range = (maxV - minV) || 1;
  var minT = data[0].ts, maxT = data[data.length-1].ts;
  var x = function(ts){ return PAD.l + ((ts - minT) / (maxT - minT)) * iw; };
  var y = function(v){ return PAD.t + ih - ((v - minV) / range) * ih; };

  // candle width calculation
  var slot = iw / data.length;
  var bodyW = Math.max(1, Math.min(10, slot * 0.7));

  var line = function(key){
    return data.map(function(r,i){ return (i?'L':'M') + x(r.ts).toFixed(1) + "," + y(r[key]).toFixed(1); }).join(" ");
  };

  var yLabels = [];
  for (var i = 0; i <= 4; i++) yLabels.push(minV + (range*i/4));
  var xticks = Math.min(6, data.length);
  var xIdx = [];
  for (var j = 0; j < xticks; j++) xIdx.push(Math.floor(j*(data.length-1)/(xticks-1||1)));

  return (
    <div style={{overflowX:"auto"}}>
      <svg viewBox={"0 0 " + W + " " + H} style={{width:"100%",minWidth:340,height:height,display:"block"}}>
        {yLabels.map(function(v,k){
          return <g key={k}>
            <line x1={PAD.l} x2={W-PAD.r} y1={y(v)} y2={y(v)} stroke="#101f35" strokeDasharray="3 3" />
            <text x={PAD.l-4} y={y(v)+3} fill="#334a6a" fontSize="10" textAnchor="end">{"₹" + v.toFixed(0)}</text>
          </g>;
        })}
        {xIdx.map(function(idx,k){
          return <text key={k} x={x(data[idx].ts)} y={H-10} fill="#334a6a" fontSize="9" textAnchor="middle">
            {(data[idx].date.getMonth()+1) + "/" + String(data[idx].date.getFullYear()).slice(2)}
          </text>;
        })}

        {chartType === "candle" && data.map(function(r, k){
          var cx = x(r.ts);
          var up = r.close >= r.open;
          var col = up ? "#22c55e" : "#ef4444";
          var top = up ? y(r.close) : y(r.open);
          var bot = up ? y(r.open) : y(r.close);
          var bh = Math.max(1, bot - top);
          return <g key={"c"+k}>
            <line x1={cx} x2={cx} y1={y(r.high)} y2={y(r.low)} stroke={col} strokeWidth="1" />
            <rect x={cx - bodyW/2} y={top} width={bodyW} height={bh} fill={col} stroke={col} strokeWidth="0.5" />
          </g>;
        })}

        {chartType === "line" && <path d={line("close")} fill="none" stroke="#60a5fa" strokeWidth="2" />}

        <path d={line("d20H")} fill="none" stroke="#f87171" strokeWidth="1.2" strokeDasharray="5 3" />
        <path d={line("d20L")} fill="none" stroke="#34d399" strokeWidth="1.2" strokeDasharray="5 3" />

        {data.map(function(r,k){
          var ev = r.events || [];
          if (ev.indexOf("target") >= 0) return <circle key={"t"+k} cx={x(r.ts)} cy={y(r.high)} r="5" fill="#fbbf24" stroke="#1c1407" strokeWidth="1.5" />;
          if (ev.indexOf("buy") >= 0) return <circle key={"b"+k} cx={x(r.ts)} cy={y(r.low)} r="5" fill="#4ade80" stroke="#052e16" strokeWidth="1.5" />;
          if (ev.indexOf("gtt-placed") >= 0) return <circle key={"g"+k} cx={x(r.ts)} cy={y(r.low)} r="3" fill="#fbbf24" />;
          return null;
        })}

        {data.map(function(r,k){
          return <rect key={k} x={x(r.ts)-slot/2} y={PAD.t} width={slot} height={ih} fill="transparent"
            onMouseEnter={function(){setHover(r);}} onTouchStart={function(){setHover(r);}} />;
        })}
      </svg>
      {hover && <div style={{background:"#0f1e33",border:"1px solid #2a3f5f",borderRadius:8,padding:"8px 12px",fontSize:11,lineHeight:1.7,fontFamily:"monospace",margin:"4px 10px"}}>
        <div style={{fontWeight:700,color:"#a0bde0"}}>{fmtD(hover.date)}</div>
        <div style={{color:"#94a3b8"}}>O: ₹{fmtN(hover.open)} &nbsp; H: ₹{fmtN(hover.high)}</div>
        <div style={{color:"#94a3b8"}}>L: ₹{fmtN(hover.low)} &nbsp; C: ₹{fmtN(hover.close)}</div>
        <div style={{color:"#f87171"}}>20D High: ₹{fmtN(hover.d20H)}</div>
        <div style={{color:"#34d399"}}>20D Low: ₹{fmtN(hover.d20L)}</div>
        {hover.gttPrice && !(hover.events||[]).includes("buy") && <div style={{color:"#fbbf24",fontWeight:700}}>🔔 GTT Pending @ ₹{fmtN(hover.gttPrice)}</div>}
        {(hover.events||[]).includes("buy") && <div style={{color:"#4ade80",fontWeight:700}}>✅ BUY @ ₹{fmtN(hover.gttPrice)}</div>}
        {hover.position && !(hover.events||[]).includes("target") && <div style={{color:"#93c5fd"}}>🎯 Target @ ₹{fmtN(hover.position.target)}</div>}
        {(hover.events||[]).includes("target") && <div style={{color:"#fbbf24",fontWeight:700}}>🎯 TARGET HIT</div>}
      </div>}
      <div style={{padding:"4px 14px",fontSize:11,color:"#64748b"}}>
        {chartType === "candle" && <><span style={{color:"#22c55e"}}>■ Up</span> &nbsp; <span style={{color:"#ef4444"}}>■ Down</span> &nbsp;</>}
        {chartType === "line" && <><span style={{color:"#60a5fa"}}>━ Close</span> &nbsp;</>}
        <span style={{color:"#f87171"}}>┄ 20D High</span> &nbsp;
        <span style={{color:"#34d399"}}>┄ 20D Low</span> &nbsp;
        <span style={{color:"#4ade80"}}>● Buy</span> &nbsp;
        <span style={{color:"#fbbf24"}}>● Target</span>
      </div>
    </div>
  );
}

function PortfolioView(props) {
  var stocks = props.stocks;
  var onSelect = props.onSelect;
  var stats = calcPortfolioStats(stocks);
  var C = { card:"#0f1e33", border:"#1e3352", muted:"#64748b", buy:"#4ade80", high:"#f87171", gtt:"#fbbf24", dim:"#4a6fa5", text:"#dce8f8" };
  var card = function(sx){ return Object.assign({ background:C.card, border:"1px solid " + C.border, borderRadius:10 }, sx || {}); };
  if (!stats) return <div style={{padding:40,textAlign:"center",color:C.muted}}>कोई स्टॉक नहीं।</div>;
  var statCards = [
    { lbl:"Stocks", val: stats.totalStocks, clr:"#93c5fd" },
    { lbl:"Total Trades", val: stats.totalTrades, clr:C.text },
    { lbl:"Win Rate", val: stats.winRate.toFixed(1) + "%", clr:C.buy },
    { lbl:"Profit Factor", val: isFinite(stats.profitFactor) ? stats.profitFactor.toFixed(2) : "∞", clr:C.gtt },
    { lbl:"Net Return", val: (stats.netPct >= 0 ? "+" : "") + stats.netPct.toFixed(2) + "%", clr: stats.netPct >= 0 ? C.buy : C.high },
    { lbl:"Expectancy", val: stats.expectancy.toFixed(2) + "%", clr: stats.expectancy >= 0 ? C.buy : C.high },
    { lbl:"Avg Win", val: "+" + stats.avgWin.toFixed(2) + "%", clr:C.buy },
    { lbl:"Avg Loss", val: "-" + stats.avgLoss.toFixed(2) + "%", clr:C.high },
    { lbl:"Avg Hold", val: stats.avgHeldDays.toFixed(1) + "d", clr:C.dim },
    { lbl:"Holding", val: stats.openCount, clr:C.gtt },
    { lbl:"GTT Active", val: stats.gttCount, clr:C.gtt },
    { lbl:"Idle", val: stats.idleCount, clr:C.muted }
  ];
  return (
    <div style={{padding:"0 16px 20px"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(90px,1fr))",gap:8,marginBottom:14}}>
        {statCards.map(function(c,i){
          return <div key={i} style={card({padding:"10px 12px",textAlign:"center"})}>
            <div style={{fontSize:16,fontWeight:700,color:c.clr,fontFamily:"monospace"}}>{c.val}</div>
            <div style={{fontSize:10,color:C.muted,marginTop:2}}>{c.lbl}</div>
          </div>;
        })}
      </div>
      <div style={card({overflow:"hidden"})}>
        <div style={{padding:"10px 14px",fontSize:12,color:C.muted,borderBottom:"1px solid " + C.border}}>
          प्रति स्टॉक परफॉर्मेंस — क्लिक करके चार्ट देखें
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
            <thead>
              <tr style={{background:"#0a1626"}}>
                {["Stock","Trades","Win%","Avg Win","Avg Loss","Net%","Status","Last"].map(function(h){
                  return <th key={h} style={{padding:"8px",textAlign:"left",color:C.muted,fontWeight:600,borderBottom:"1px solid " + C.border,whiteSpace:"nowrap",fontSize:10}}>{h}</th>;
                })}
              </tr>
            </thead>
            <tbody>
              {stats.perStock.map(function(p,i){
                var statusClr = p.status === "HOLDING" ? C.buy : p.status === "GTT" ? C.gtt : C.muted;
                return <tr key={i} style={{borderBottom:"1px solid #0d1a2a",cursor:onSelect?"pointer":"default"}}
                  onClick={onSelect ? function(){ onSelect(i); } : null}>
                  <td style={{padding:"7px 8px",color:"#93c5fd",fontWeight:600,whiteSpace:"nowrap"}}>{p.name}</td>
                  <td style={{padding:"7px 8px",fontFamily:"monospace"}}>{p.trades}</td>
                  <td style={{padding:"7px 8px",fontFamily:"monospace",color:p.winRate>=50?C.buy:C.high}}>{p.winRate.toFixed(0)}%</td>
                  <td style={{padding:"7px 8px",fontFamily:"monospace",color:C.buy}}>+{p.avgWin.toFixed(2)}</td>
                  <td style={{padding:"7px 8px",fontFamily:"monospace",color:C.high}}>-{p.avgLoss.toFixed(2)}</td>
                  <td style={{padding:"7px 8px",fontFamily:"monospace",fontWeight:700,color:p.netPct>=0?C.buy:C.high}}>{(p.netPct>=0?"+":"")+p.netPct.toFixed(2)}%</td>
                  <td style={{padding:"7px 8px",color:statusClr,fontWeight:700,fontSize:10}}>{p.status}</td>
                  <td style={{padding:"7px 8px",fontFamily:"monospace",color:C.muted}}>{p.lastClose ? "₹" + p.lastClose.toFixed(1) : "—"}</td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function App() {
  var st = React.useState([]); var stocks = st[0]; var setStocks = st[1];
  var ac = React.useState(0); var active = ac[0]; var setActive = ac[1];
  var md = React.useState(false); var modal = md[0]; var setModal = md[1];
  var ct = React.useState(""); var csvTxt = ct[0]; var setCsvTxt = ct[1];
  var lb = React.useState(""); var label = lb[0]; var setLabel = lb[1];
  var er = React.useState(""); var err = er[0]; var setErr = er[1];
  var lo = React.useState(""); var loading = lo[0]; var setLoading = lo[1];
  var vw = React.useState("chart"); var view = vw[0]; var setView = vw[1];
  var ch = React.useState("candle"); var chartType = ch[0]; var setChartType = ch[1];
  var su = React.useState(function(){ try { return localStorage.getItem(SHEET_URL_KEY) || ""; } catch(e) { return ""; } });
  var sheetUrl = su[0]; var setSheetUrl = su[1];

  function saveSheetUrl(u) {
    setSheetUrl(u);
    try { localStorage.setItem(SHEET_URL_KEY, u); } catch(e) {}
  }

  function handleAdd(csvRaw, lbl) {
    setErr("");
    var parsed = parseCSV(csvRaw);
    if (parsed.error) { setErr(parsed.error); return false; }
    var res = calcSignals(parsed.rows);
    var name = (lbl && lbl.trim()) || parsed.stockName || ("Stock " + (stocks.length + 1));
    var newStock = { name: name, rows: res.rows, trades: res.trades, openPosition: res.openPosition, pendingGtt: res.pendingGtt };
    setStocks(function(p){
      var idx = -1;
      for (var k = 0; k < p.length; k++) { if (p[k].name === name) { idx = k; break; } }
      if (idx >= 0) {
        var copy = p.slice();
        copy[idx] = newStock;
        setActive(idx);
        return copy;
      }
      setActive(p.length);
      return p.concat([newStock]);
    });
    return true;
  }

  function submitAdd() {
    var fullName = label ? "NSE:" + label.replace(/^NSE:/i, "") : "";
    if (handleAdd(csvTxt, fullName)) { setCsvTxt(""); setLabel(""); setModal(false); }
  }

  function directLoad() {
    if (!label || !label.trim()) { setErr("पहले stock चुनें"); return; }
    setErr(""); setLoading(label + " का data ला रहे हैं...");
    fetchFromYahoo(label.trim()).then(function(r){
      var ok = handleAdd(r.csv, r.name);
      if (ok) { setCsvTxt(""); setLabel(""); setModal(false); }
    }).catch(function(e){ setErr("❌ " + e.message); }).finally(function(){ setLoading(""); });
  }

  function loadFromSheet() {
    if (!sheetUrl || !sheetUrl.trim()) { setErr("पहले Sheet की URL paste करें"); return; }
    setErr(""); setLoading("Google Sheet से data ला रहे हैं...");
    fetchFromSheet(sheetUrl.trim()).then(function(r){
      var ok = handleAdd(r.csv, "");
      if (ok) { setCsvTxt(""); setLabel(""); setModal(false); }
    }).catch(function(e){ setErr("❌ " + e.message); }).finally(function(){ setLoading(""); });
  }

  function removeStock(idx) {
    setStocks(function(p){ return p.filter(function(_,i){ return i !== idx; }); });
    setActive(function(a){ return Math.max(0, a >= idx ? a-1 : a); });
  }

  function onFile(e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(ev){ setCsvTxt(ev.target.result); };
    reader.readAsText(f);
  }

  var s = stocks[active];
  var last = s ? s.rows[s.rows.length - 1] : null;
  var C = { bg:"#080f1a", card:"#0f1e33", border:"#1e3352", accent:"#2563eb", dim:"#4a6fa5", muted:"#64748b", buy:"#4ade80", buyBg:"rgba(74,222,128,0.08)", gtt:"#fbbf24", gttBg:"rgba(251,191,36,0.08)", high:"#f87171", low:"#34d399", text:"#dce8f8" };
  var card = function(sx){ return Object.assign({ background:C.card, border:"1px solid " + C.border, borderRadius:10 }, sx || {}); };
  var views = [
    { key:"chart", lbl:"📊 Chart" },
    { key:"trades", lbl:"💼 Trades" },
    { key:"log", lbl:"📜 Event Log" },
    { key:"table", lbl:"📋 Table" },
    { key:"portfolio", lbl:"📊 Portfolio" }
  ];
  var events = s ? s.rows.filter(function(r){ return r.events && r.events.length; }) : [];

  return (
    <div style={{ fontFamily:"'Inter',system-ui,sans-serif", background:C.bg, color:C.text, minHeight:"100vh", fontSize:14 }}>
      <div style={{ background:C.card, padding:"12px 16px", display:"flex", alignItems:"center", gap:10, borderBottom:"1px solid " + C.border }}>
        <div style={{ flex:1 }}>
          <span style={{ fontWeight:700, fontSize:16 }}>📈 20-Day Breakout + GTT</span>
          <span style={{ fontSize:11, color:C.muted, marginLeft:10 }}>6.28% Target</span>
        </div>
        <button onClick={function(){ setModal(true); }}
          style={{ background:C.accent, color:"#fff", border:"none", borderRadius:8, padding:"7px 14px", fontSize:13, fontWeight:600, cursor:"pointer" }}>
          + Stock
        </button>
      </div>
      {stocks.length > 0 && <div style={{ display:"flex", overflowX:"auto", background:C.card, borderBottom:"1px solid " + C.border, padding:"0 8px" }}>
        {stocks.map(function(stk,i){
          return <div key={i} style={{ display:"flex", alignItems:"center", gap:4 }}>
            <button onClick={function(){ setActive(i); }} style={{ background:"none", border:"none", borderBottom: active===i ? "2px solid " + C.accent : "2px solid transparent", color: active===i ? "#93c5fd" : C.muted, padding:"9px 10px", fontSize:12, fontWeight: active===i ? 700 : 400, cursor:"pointer", whiteSpace:"nowrap" }}>{stk.name}</button>
            <button onClick={function(){ removeStock(i); }} style={{ background:"none", border:"none", color:C.muted, cursor:"pointer", fontSize:14, padding:"0 4px 0 0", lineHeight:1 }}>×</button>
          </div>;
        })}
      </div>}
      {!s && <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:18, padding:48, minHeight:"65vh", textAlign:"center" }}>
        <div style={{ fontSize:52 }}>📊</div>
        <div>
          <div style={{ fontWeight:700, fontSize:20, marginBottom:6 }}>GTT Backtest शुरू करें</div>
          <div style={{ color:C.muted, fontSize:13 }}>Google Sheet link करो, या Yahoo से auto data</div>
        </div>
        <div style={{ display:"flex", gap:10, flexWrap:"wrap", justifyContent:"center" }}>
          <button onClick={function(){ setModal(true); }} disabled={!!loading}
            style={{ background:C.accent, color:"#fff", border:"none", borderRadius:10, padding:"11px 22px", fontSize:14, fontWeight:600, cursor:"pointer", opacity: loading ? 0.6 : 1 }}>

          </button>
          {sheetUrl && <button onClick={loadFromSheet} disabled={!!loading}
            style={{ background:"#16a34a", color:"#fff", border:"none", borderRadius:10, padding:"11px 22px", fontSize:14, fontWeight:600, cursor:"pointer", opacity: loading ? 0.6 : 1 }}>

        </div>

        <div style={card({ padding:"12px 18px", maxWidth:440, textAlign:"left" })}>

              <div style={{ fontSize:17, fontWeight:700, color:c.clr, fontFamily:"monospace" }}>{c.val}</div>
              <div style={{ fontSize:10, color:C.muted, marginTop:2 }}>{c.lbl}</div>
            </div>;

          <span style={{ fontSize:11, color:C.muted }}>Status ({fmtD(last.date)}):</span>
          {s.openPosition && <span style={{ background:"#04130b", color:C.buy, border:"1px solid #166534", borderRadius:6, padding:"3px 10px", fontSize:12, fontWeight:700 }}>📈 HOLDING @ ₹{fmtN(s.openPosition.entry)} — Target ₹{fmtN(s.openPosition.target)}</span>}
          {!s.openPosition && s.pendingGtt && <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:6, padding:"3px 10px", fontSize:12, fontWeight:700 }}>🔔 GTT PENDING @ ₹{fmtN(s.pendingGtt.price)}</span>}
          {!s.openPosition && !s.pendingGtt && <span style={{ color:C.muted, fontSize:12 }}>⏳ IDLE</span>}
        </div>}
        <div style={{ padding:"0 16px 12px", display:"flex", gap:6, overflowX:"auto" }}>

            </div>
            <div style={{ display:"flex", gap:20, fontSize:12, color:"#94a3b8", flexWrap:"wrap" }}>
              <span>Buy @ <b style={{color:C.buy}}>₹{fmtN(s.openPosition.entry)}</b></span>
              <span>Target @ <b style={{color:C.gtt}}>₹{fmtN(s.openPosition.target)}</b></span>
            </div>
          </div>}
        </div>}
        {view === "log" && <div style={{ padding:"0 16px 20px", display:"flex", flexDirection:"column", gap:8 }}>
          {events.length === 0 && <div style={{ color:C.muted, textAlign:"center", padding:40 }}>कोई event नहीं।</div>}
          {events.map(function(r,i){
            return <div key={i} style={{ background: r.events.includes("target") ? "#120d00" : r.events.includes("buy") ? "#04130b" : C.card, border: "1px solid " + (r.events.includes("target") ? "#78350f" : r.events.includes("buy") ? "#166534" : C.border), borderRadius:10, padding:"10px 14px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6, flexWrap:"wrap", gap:6 }}>
                <span style={{ color:C.dim, fontWeight:700, fontSize:13, fontFamily:"monospace" }}>{fmtD(r.date)}</span>
                <span style={{ display:"flex", gap:6 }}>
                  {r.events.includes("gtt-placed") && <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>🔔 GTT</span>}
                  {r.events.includes("buy") && <span style={{ background:"#052e16", color:C.buy, border:"1px solid #166534", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>✅ BUY</span>}
                  {r.events.includes("target") && <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>🎯 TARGET</span>}
                </span>
              </div>
              <div style={{ display:"flex", gap:20, fontSize:12, color:"#94a3b8", flexWrap:"wrap" }}>
                <span>H: ₹{fmtN(r.high)}</span>
                <span>L: ₹{fmtN(r.low)}</span>
                <span>C: ₹{fmtN(r.close)}</span>
                {r.gttPrice && <span>GTT @ <b style={{color:C.gtt}}>₹{fmtN(r.gttPrice)}</b></span>}
                {r.position && <span>Target @ <b style={{color:"#93c5fd"}}>₹{fmtN(r.position.target)}</b></span>}
              </div>
            </div>;
          })}
        </div>}
        {view === "table" && <div style={{ overflowX:"auto", padding:"0 0 20px" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
            <thead>
              <tr style={{ background:C.card }}>
                {["Date","Close","20D Low","20D High","GTT Price","Event"].map(function(h){
                  return <th key={h} style={{ padding:"8px", textAlign:["Date","Event"].indexOf(h)>=0?"left":"right", color:C.muted, fontWeight:600, borderBottom:"1px solid " + C.border, whiteSpace:"nowrap", fontSize:10 }}>{h}</th>;
                })}
              </tr>
            </thead>
            <tbody>
              {s.rows.slice().reverse().map(function(r,i){
                var isBuy = r.events && r.events.includes("buy");
                var isTarget = r.events && r.events.includes("target");
                var isGtt = r.events && r.events.includes("gtt-placed");
                var bg = isTarget ? C.gttBg : isBuy ? C.buyBg : "transparent";
                return <tr key={i} style={{ background: bg, borderBottom:"1px solid #0d1a2a" }}>
                  <td style={{ padding:"6px 8px", color:C.dim, whiteSpace:"nowrap", fontFamily:"monospace", fontSize:10 }}>{fmtD(r.date)}</td>
                  <td style={{ padding:"6px 8px", textAlign:"right", fontWeight:600, fontFamily:"monospace" }}>{fmtN(r.close)}</td>
                  <td style={{ padding:"6px 8px", textAlign:"right", color:C.low, fontFamily:"monospace" }}>{r.d20L ? fmtN(r.d20L) : "—"}</td>
                  <td style={{ padding:"6px 8px", textAlign:"right", color:C.high, fontFamily:"monospace" }}>{r.d20H ? fmtN(r.d20H) : "—"}</td>
                  <td style={{ padding:"6px 8px", textAlign:"right", color:C.gtt, fontFamily:"monospace" }}>{r.gttPrice ? fmtN(r.gttPrice) : "—"}</td>
                  <td style={{ padding:"6px 8px", fontSize:10, whiteSpace:"nowrap" }}>
                    {isGtt && <span style={{ color:C.gtt, marginRight:6 }}>🔔 GTT</span>}
                    {isBuy && <span style={{ color:C.buy, marginRight:6 }}>✅ BUY</span>}
                    {isTarget && <span style={{ color:C.gtt }}>🎯 TARGET</span>}
                  </td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>}
        {view === "portfolio" && <PortfolioView stocks={stocks} onSelect={function(i){ setActive(i); setView("chart"); }} />}
      </div>}
      {modal && <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.8)", display:"flex", alignItems:"flex-end", zIndex:100 }}
        onClick={function(e){ if (e.currentTarget === e.target) { setModal(false); setErr(""); } }}>
        <div style={{ background:"#0d1a2a", borderTop:"1px solid " + C.border, borderRadius:"18px 18px 0 0", padding:20, width:"100%", maxHeight:"90vh", overflowY:"auto" }}>
          <div style={{ fontWeight:700, fontSize:16, marginBottom:18 }}>📥 Stock Add करें</div>

          <div style={{ background:"#052e16", border:"1px solid #166534", borderRadius:10, padding:"12px 14px", marginBottom:14 }}>
            <div style={{ fontSize:12, color:"#86efac", fontWeight:700, marginBottom:8 }}>🔗 Google Sheet से</div>
            <input
              value={sheetUrl}
              onChange={function(e){ saveSheetUrl(e.target.value); }}
              placeholder="Sheet की published CSV URL या Apps Script URL"
              style={{ width:"100%", background:C.bg, border:"1px solid " + C.border, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:11, fontFamily:"monospace", boxSizing:"border-box", marginBottom:10, outline:"none" }} />
            <button onClick={loadFromSheet} disabled={!!loading}
              style={{ width:"100%", background:"#16a34a", color:"#fff", border:"none", borderRadius:8, padding:11, fontSize:14, fontWeight:700, cursor:"pointer", opacity: loading ? 0.6 : 1 }}>
              {loading ? "⏳ " + loading : "🔄 Sheet से Load करो"}
            </button>
          </div>

          <div style={{ textAlign:"center", fontSize:11, color:C.muted, marginBottom:12 }}>─── या ───</div>

          <label style={{ fontSize:12, color:C.muted, display:"block", marginBottom:4 }}>📥 Yahoo से (auto)</label>
          <input list="nifty200-list" value={label} onChange={function(e){ setLabel(e.target.value); }} placeholder="Stock चुनें"
            style={{ width:"100%", background:C.bg, border:"1px solid " + C.border, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:14, boxSizing:"border-box", marginBottom:10, outline:"none" }} />
          <datalist id="nifty200-list">
            {NIFTY200.map(function(stk){ return <option key={stk.sym} value={stk.sym}>{stk.sym} — {stk.name}</option>; })}
          </datalist>
          <button onClick={directLoad} disabled={!!loading}
            style={{ width:"100%", background:"#2563eb", color:"#fff", border:"none", borderRadius:8, padding:11, fontSize:14, fontWeight:700, cursor:"pointer", marginBottom:14, opacity: loading ? 0.6 : 1 }}>
            {loading ? "⏳ " + loading : "📥 Yahoo से Load करो"}
          </button>

          <div style={{ textAlign:"center", fontSize:11, color:C.muted, marginBottom:12 }}>─── या manual ───</div>

          <input type="file" accept=".csv,.txt" onChange={onFile}
            style={{ width:"100%", background:C.bg, border:"1px solid " + C.border, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:13, boxSizing:"border-box", marginBottom:10 }} />
          <textarea value={csvTxt} onChange={function(e){ setCsvTxt(e.target.value); }} rows={4}
            placeholder={"Date,Open,High,Low,Close,Volume"}
            style={{ width:"100%", background:C.bg, border:"1px solid " + C.border, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:11, fontFamily:"monospace", resize:"vertical", boxSizing:"border-box", marginBottom:10, outline:"none" }} />

          {err && <div style={{ color:"#f87171", background:"rgba(239,68,68,.1)", border:"1px solid rgba(239,68,68,.3)", borderRadius:8, padding:"8px 12px", fontSize:12, marginBottom:12 }}>{err}</div>}

          <div style={{ display:"flex", gap:10 }}>
            <button onClick={function(){ setModal(false); setErr(""); setCsvTxt(""); setLabel(""); }}
              style={{ flex:1, background:C.border, color:C.text, border:"none", borderRadius:10, padding:12, fontSize:14, cursor:"pointer" }}>Cancel</button>
            <button onClick={submitAdd}
              style={{ flex:2, background:C.accent, color:"#fff", border:"none", borderRadius:10, padding:12, fontSize:14, fontWeight:700, cursor:"pointer" }}>✅ Manual CSV</button>
          </div>
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
