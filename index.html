const { useState, useMemo } = React;

const PERIOD = 20;
const EPS = 0.03;
const TARGET_PCT = 0.0628;

function parseDate(s) {
  if (!s) return null;
  const d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}
function fmtD(d) {
  if (!d) return "—";
  return d.toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"2-digit" });
}
function fmtN(v, dec=2) {
  if (v == null || isNaN(v)) return "—";
  return Number(v).toFixed(dec);
}
function inrFmt(v) {
  if (!v) return "—";
  return Number(v).toLocaleString("en-IN");
}

function parseCSV(raw) {
  if (!raw?.trim()) return { error: "CSV खाली है।" };
  const lines = raw.trim().split("\n").map(l => l.trim()).filter(Boolean);
  let stockName = "", hIdx = -1;
  for (let i = 0; i < Math.min(lines.length, 10); i++) {
    if (/^date/i.test(lines[i])) { hIdx = i; break; }
    const p = lines[i].split(",");
    const cell = p[0]?.trim();
    if (cell && !/^\d/.test(cell) && !/\*/.test(cell) && cell.length > 1) stockName = cell;
  }
  if (hIdx === -1) return { error: '"Date,Open,High,Low,Close,Volume" header row नहीं मिला।' };
  const hdr = lines[hIdx].split(",").map(h => h.trim().toLowerCase());
  const gi = (...names) => { for (const n of names) { const x=hdr.indexOf(n); if(x>=0) return x; } return -1; };
  const di=gi("date","datetime","time"), oi=gi("open"), hi=gi("high"), li=gi("low"), ci=gi("close"), vi=gi("volume","vol");
  if ([di,hi,li].some(x=>x<0)) return { error: "Date / High / Low columns नहीं मिले।" };
  const rows = [];
  for (let i = hIdx+1; i < lines.length; i++) {
    const p = lines[i].split(",");
    if (p.length < 4) continue;
    const date = parseDate(p[di]?.trim());
    if (!date) continue;
    const high  = parseFloat(p[hi]);
    const low   = parseFloat(p[li]);
    const close = ci>=0 ? parseFloat(p[ci]) : high;
    const open  = oi>=0 ? parseFloat(p[oi]) : close;
    const vol   = vi>=0 ? parseInt(p[vi])||0 : 0;
    if (isNaN(high)||isNaN(low)) continue;
    rows.push({ date, open, high, low, close, vol, ts: date.getTime() });
  }
  rows.sort((a,b)=>a.ts-b.ts);
  if (rows.length < PERIOD) return { error: `कम से कम ${PERIOD} rows चाहिए। मिले: ${rows.length}` };
  return { stockName, rows };
}

function calcSignals(rows) {
  const enriched = rows.map((r, i) => {
    if (i < PERIOD - 1) return { ...r, d20L: null, d20H: null, prevD20H: null, newLow: false, events: [], gttPrice: null };
    const win  = rows.slice(i - PERIOD + 1, i + 1);
    const d20L = Math.min(...win.map(x => x.low));
    const d20H = Math.max(...win.map(x => x.high));
    return { ...r, d20L, d20H, prevD20H: null, newLow: r.low <= d20L + EPS, events: [], gttPrice: null };
  });
  for (let i = 1; i < enriched.length; i++) {
    if (enriched[i-1].d20H != null) enriched[i].prevD20H = enriched[i-1].d20H;
  }
  let state = "IDLE";
  let entryPrice = null, entryDate = null, entryIdx = -1, targetPrice = null;
  const trades = [];
  for (let i = 0; i < enriched.length; i++) {
    const r = enriched[i];
    if (r.d20H == null) continue;
    if (state === "IN_POSITION") {
      r.position = { entry: entryPrice, entryDate, target: targetPrice };
      if (r.high >= targetPrice - EPS) {
        r.events.push("target");
        trades.push({ entryDate, entry: entryPrice, exitDate: r.date, exit: targetPrice, days: i - entryIdx, pct: TARGET_PCT * 100 });
        state = "IDLE";
        entryPrice = null; entryDate = null; entryIdx = -1; targetPrice = null;
      }
      continue;
    }
    if (state === "GTT_ACTIVE") {
      const gttToday = r.prevD20H;
      if (gttToday != null && r.high >= gttToday - EPS) {
        r.events.push("buy");
        r.gttPrice = gttToday;
        entryPrice = gttToday;
        entryDate = r.date;
        entryIdx = i;
        targetPrice = entryPrice * (1 + TARGET_PCT);
        if (r.high >= targetPrice - EPS) {
          r.events.push("target");
          trades.push({ entryDate, entry: entryPrice, exitDate: r.date, exit: targetPrice, days: 0, pct: TARGET_PCT * 100 });
          state = "IDLE";
          entryPrice = null; entryDate = null; entryIdx = -1; targetPrice = null;
        } else {
          state = "IN_POSITION";
        }
      } else {
        r.gttPrice = r.d20H;
      }
      continue;
    }
    if (r.newLow) {
      state = "GTT_ACTIVE";
      r.events.push("gtt-placed");
      r.gttPrice = r.d20H;
    }
  }
  let openPosition = null, pendingGtt = null;
  if (state === "IN_POSITION") {
    openPosition = { entry: entryPrice, entryDate, target: targetPrice, entryIdx };
  } else if (state === "GTT_ACTIVE") {
    const last = enriched[enriched.length - 1];
    pendingGtt = { price: last.d20H, date: last.date };
  }
  return { rows: enriched, trades, openPosition, pendingGtt };
}

// Custom SVG Chart
function MiniChart({ rows, height=280 }) {
  const [hover, setHover] = useState(null);
  const W = 800, H = height, PAD = { l:50, r:10, t:20, b:30 };
  const iw = W - PAD.l - PAD.r;
  const ih = H - PAD.t - PAD.b;
  const data = rows.filter(r => r.d20H != null);
  if (!data.length) return null;
  const allVals = data.flatMap(r => [r.close, r.d20H, r.d20L]);
  const minV = Math.min(...allVals);
  const maxV = Math.max(...allVals);
  const range = (maxV - minV) || 1;
  const minT = data[0].ts, maxT = data[data.length-1].ts;
  const x = ts => PAD.l + ((ts - minT) / (maxT - minT)) * iw;
  const y = v => PAD.t + ih - ((v - minV) / range) * ih;
  const line = key => data.map((r,i) => `${i?'L':'M'}${x(r.ts).toFixed(1)},${y(r[key]).toFixed(1)}`).join(' ');
  const yticks = 4;
  const yLabels = Array.from({length:yticks+1},(_,i)=>minV+(range*i/yticks));
  const xticks = Math.min(6, data.length);
  const xIdx = Array.from({length:xticks},(_,i)=>Math.floor(i*(data.length-1)/(xticks-1||1)));
  return (
    <div style={{overflowX:"auto"}}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:340,height:height,display:"block"}}
        onMouseLeave={()=>setHover(null)}>
        {yLabels.map((v,i)=>(
          <g key={i}>
            <line x1={PAD.l} x2={W-PAD.r} y1={y(v)} y2={y(v)} stroke="#101f35" strokeDasharray="3 3" />
            <text x={PAD.l-4} y={y(v)+3} fill="#334a6a" fontSize="10" textAnchor="end">₹{v.toFixed(0)}</text>
          </g>
        ))}
        {xIdx.map(i=>(
          <text key={i} x={x(data[i].ts)} y={H-10} fill="#334a6a" fontSize="9" textAnchor="middle">
            {`${data[i].date.getMonth()+1}/${String(data[i].date.getFullYear()).slice(2)}`}
          </text>
        ))}
        <path d={line("d20H")} fill="none" stroke="#f87171" strokeWidth="1.2" strokeDasharray="5 3" />
        <path d={line("d20L")} fill="none" stroke="#34d399" strokeWidth="1.2" strokeDasharray="5 3" />
        <path d={line("close")} fill="none" stroke="#60a5fa" strokeWidth="2" />
        {data.map((r,i)=>{
          const ev = r.events||[];
          if (ev.includes("target")) return <circle key={'t'+i} cx={x(r.ts)} cy={y(r.close)} r="5" fill="#fbbf24" stroke="#1c1407" strokeWidth="1.5" />;
          if (ev.includes("buy"))    return <circle key={'b'+i} cx={x(r.ts)} cy={y(r.close)} r="5" fill="#4ade80" stroke="#052e16" strokeWidth="1.5" />;
          if (ev.includes("gtt-placed")) return <circle key={'g'+i} cx={x(r.ts)} cy={y(r.close)} r="3" fill="#fbbf24" />;
          return null;
        })}
        {data.map((r,i)=>(
          <rect key={i} x={x(r.ts)-4} y={PAD.t} width="8" height={ih} fill="transparent"
            onMouseEnter={()=>setHover(r)} onTouchStart={()=>setHover(r)} />
        ))}
      </svg>
      {hover && (
        <div style={{background:"#0f1e33",border:"1px solid #2a3f5f",borderRadius:8,padding:"8px 12px",fontSize:11,lineHeight:1.7,fontFamily:"monospace",margin:"4px 10px"}}>
          <div style={{fontWeight:700,color:"#a0bde0"}}>{fmtD(hover.date)}</div>
          <div style={{color:"#60a5fa"}}>Close: ₹{fmtN(hover.close)}</div>
          <div style={{color:"#f87171"}}>20D High: ₹{fmtN(hover.d20H)}</div>
          <div style={{color:"#34d399"}}>20D Low: ₹{fmtN(hover.d20L)}</div>
          {hover.gttPrice && !hover.events?.includes("buy") && <div style={{color:"#fbbf24",fontWeight:700}}>🔔 GTT Pending @ ₹{fmtN(hover.gttPrice)}</div>}
          {hover.events?.includes("buy") && <div style={{color:"#4ade80",fontWeight:700}}>✅ BUY @ ₹{fmtN(hover.gttPrice)}</div>}
          {hover.position && !hover.events?.includes("target") && <div style={{color:"#93c5fd"}}>🎯 Target @ ₹{fmtN(hover.position.target)}</div>}
          {hover.events?.includes("target") && <div style={{color:"#fbbf24",fontWeight:700}}>🎯 TARGET HIT</div>}
        </div>
      )}
      <div style={{padding:"4px 14px",fontSize:11,color:"#64748b"}}>
        <span style={{color:"#60a5fa"}}>━ Close</span> &nbsp;
        <span style={{color:"#f87171"}}>┄ 20D High</span> &nbsp;
        <span style={{color:"#34d399"}}>┄ 20D Low</span> &nbsp;
        <span style={{color:"#4ade80"}}>● Buy</span> &nbsp;
        <span style={{color:"#fbbf24"}}>● Target</span>
      </div>
    </div>
  );
}

function App() {
  const [stocks, setStocks] = useState([]);
  const [active, setActive] = useState(0);
  const [modal, setModal] = useState(false);
  const [csvTxt, setCsvTxt] = useState("");
  const [label, setLabel] = useState("");
  const [err, setErr] = useState("");
  const [view, setView] = useState("chart");
  const [stockSearch, setStockSearch] = useState("");
  const [showPicker, setShowPicker] = useState(false);

  function handleAdd(csvRaw, lbl) {
    setErr("");
    const parsed = parseCSV(csvRaw);
    if (parsed.error) { setErr(parsed.error); return false; }
    const res = calcSignals(parsed.rows);
    const name = lbl?.trim() || parsed.stockName || `Stock ${stocks.length + 1}`;
    setStocks(p => [...p, { name, ...res }]);
    setActive(stocks.length);
    return true;
  }
  function submitAdd() {
    if (handleAdd(csvTxt, label)) { setCsvTxt(""); setLabel(""); setModal(false); setStockSearch(""); setShowPicker(false); }
  }
  function loadSample() { handleAdd(SAMPLE_CSV, "NSE:NTPC (Demo)"); }
  function removeStock(idx) {
    setStocks(p => p.filter((_,i) => i !== idx));
    setActive(a => Math.max(0, a >= idx ? a-1 : a));
  }
  function onFile(e) {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = ev => setCsvTxt(ev.target.result);
    reader.readAsText(f);
  }
  const s = stocks[active];
  const last = s?.rows[s.rows.length - 1];
  const C = {
    bg:"#080f1a", card:"#0f1e33", border:"#1e3352", accent:"#2563eb",
    dim:"#4a6fa5", muted:"#64748b",
    buy:"#4ade80", buyBg:"rgba(74,222,128,0.08)",
    gtt:"#fbbf24", gttBg:"rgba(251,191,36,0.08)",
    high:"#f87171", low:"#34d399", text:"#dce8f8",
  };
  const card = (sx={}) => ({ background:C.card, border:`1px solid ${C.border}`, borderRadius:10, ...sx });
  const views = [
    { key:"chart",  lbl:"📊 Chart" },
    { key:"trades", lbl:"💼 Trades" },
    { key:"log",    lbl:"📜 Event Log" },
    { key:"table",  lbl:"📋 Table" },
  ];
  const events = s ? s.rows.filter(r => r.events?.length) : [];
  return (
    <div style={{ fontFamily:"'Inter',system-ui,sans-serif", background:C.bg, color:C.text, minHeight:"100vh", fontSize:14 }}>
      <div style={{ background:C.card, padding:"12px 16px", display:"flex", alignItems:"center", gap:10, borderBottom:`1px solid ${C.border}` }}>
        <div style={{ flex:1 }}>
          <span style={{ fontWeight:700, fontSize:16 }}>📈 20-Day Breakout + GTT Tracker</span>
          <span style={{ fontSize:11, color:C.muted, marginLeft:10 }}>6.28% Target</span>
        </div>
        <button onClick={() => setModal(true)}
          style={{ background:C.accent, color:"#fff", border:"none", borderRadius:8, padding:"7px 14px", fontSize:13, fontWeight:600, cursor:"pointer" }}>
          + Stock
        </button>
      </div>
      {stocks.length > 0 && (
        <div style={{ display:"flex", overflowX:"auto", background:C.card, borderBottom:`1px solid ${C.border}`, padding:"0 8px" }}>
          {stocks.map((st, i) => (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:4 }}>
              <button onClick={() => setActive(i)} style={{
                background:"none", border:"none",
                borderBottom: active===i ? `2px solid ${C.accent}` : "2px solid transparent",
                color: active===i ? "#93c5fd" : C.muted,
                padding:"9px 10px", fontSize:12, fontWeight: active===i ? 700 : 400,
                cursor:"pointer", whiteSpace:"nowrap"
              }}>{st.name}</button>
              <button onClick={() => removeStock(i)}
                style={{ background:"none", border:"none", color:C.muted, cursor:"pointer", fontSize:14, padding:"0 4px 0 0", lineHeight:1 }}>×</button>
            </div>
          ))}
        </div>
      )}
      {!s && (
        <div style={{ display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:18, padding:48, minHeight:"65vh", textAlign:"center" }}>
          <div style={{ fontSize:52 }}>📊</div>
          <div>
            <div style={{ fontWeight:700, fontSize:20, marginBottom:6 }}>GTT Backtest शुरू करें</div>
            <div style={{ color:C.muted, fontSize:13 }}>20D low पर GTT लगाओ, breakout पर buy, 6.28% पर exit</div>
          </div>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", justifyContent:"center" }}>
            <button onClick={() => setModal(true)} style={{ background:C.accent, color:"#fff", border:"none", borderRadius:10, padding:"11px 22px", fontSize:14, fontWeight:600, cursor:"pointer" }}>
              + Stock Add करें
            </button>
            <button onClick={loadSample} style={{ background:"none", color:"#93c5fd", border:`1px solid ${C.border}`, borderRadius:10, padding:"11px 22px", fontSize:14, fontWeight:600, cursor:"pointer" }}>
              🔍 NTPC Demo
            </button>
          </div>
          <div style={{ ...card(), padding:"12px 18px", maxWidth:400, textAlign:"left" }}>
            <div style={{ fontSize:12, color:C.muted, lineHeight:1.9 }}>
              <b style={{color:C.text}}>Strategy:</b><br/>
              1️⃣ <span style={{color:C.gtt}}>नया 20D Low</span> → GTT @ 20D High<br/>
              2️⃣ <span style={{color:C.buy}}>Price ≥ GTT</span> → BUY<br/>
              3️⃣ <span style={{color:"#93c5fd"}}>Target = Buy × 1.0628</span><br/>
              4️⃣ Target hit → Trade close → फिर IDLE
            </div>
          </div>
        </div>
      )}
      {s && (
        <div>
          <div style={{ display:"flex", gap:10, padding:"14px 16px", overflowX:"auto" }}>
            {[
              { lbl:"Total Days", val: s.rows.length, clr: C.dim },
              { lbl:"Closed Trades", val: s.trades.length, clr: C.buy },
              { lbl:"Open Position", val: s.openPosition ? "1" : "0", clr: s.openPosition ? C.gtt : C.muted },
              { lbl:"Latest Close", val: `₹${fmtN(last?.close)}`, clr:"#93c5fd" },
              { lbl:"20D High", val: `₹${fmtN(last?.d20H)}`, clr: C.high },
              { lbl:"20D Low", val: `₹${fmtN(last?.d20L)}`, clr: C.low },
            ].map((c,i) => (
              <div key={i} style={{ ...card(), padding:"10px 16px", minWidth:90, textAlign:"center", flexShrink:0 }}>
                <div style={{ fontSize:17, fontWeight:700, color:c.clr, fontFamily:"monospace" }}>{c.val}</div>
                <div style={{ fontSize:10, color:C.muted, marginTop:2 }}>{c.lbl}</div>
              </div>
            ))}
          </div>
          {last?.d20H && (
            <div style={{ margin:"0 16px 12px", ...card(), padding:"10px 16px", display:"flex", gap:12, alignItems:"center", flexWrap:"wrap" }}>
              <span style={{ fontSize:11, color:C.muted }}>Status ({fmtD(last.date)}):</span>
              {s.openPosition && (
                <span style={{ background:"#04130b", color:C.buy, border:"1px solid #166534", borderRadius:6, padding:"3px 10px", fontSize:12, fontWeight:700 }}>
                  📈 HOLDING @ ₹{fmtN(s.openPosition.entry)} — Target ₹{fmtN(s.openPosition.target)}
                </span>
              )}
              {!s.openPosition && s.pendingGtt && (
                <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:6, padding:"3px 10px", fontSize:12, fontWeight:700 }}>
                  🔔 GTT PENDING @ ₹{fmtN(s.pendingGtt.price)}
                </span>
              )}
              {!s.openPosition && !s.pendingGtt && (
                <span style={{ color:C.muted, fontSize:12 }}>⏳ IDLE — नए 20D low का इंतज़ार</span>
              )}
            </div>
          )}
          <div style={{ padding:"0 16px 12px", display:"flex", gap:6, overflowX:"auto" }}>
            {views.map(v => (
              <button key={v.key} onClick={() => setView(v.key)} style={{
                background: view===v.key ? C.accent : "none",
                color: view===v.key ? "#fff" : C.muted,
                border: `1px solid ${view===v.key ? C.accent : C.border}`,
                borderRadius:8, padding:"6px 12px", fontSize:12,
                cursor:"pointer", fontWeight: view===v.key ? 700 : 400, whiteSpace:"nowrap"
              }}>{v.lbl}</button>
            ))}
          </div>
          {view === "chart" && (
            <div style={{ padding:"0 10px 20px" }}>
              <div style={{ ...card(), padding:"10px 0" }}>
                <div style={{ paddingLeft:14, fontSize:12, color:C.muted, marginBottom:6 }}>{s.name} — Close + 20D Bands</div>
                <MiniChart rows={s.rows} />
              </div>
            </div>
          )}
          {view === "trades" && (
            <div style={{ padding:"0 16px 20px", display:"flex", flexDirection:"column", gap:8 }}>
              {s.trades.length === 0 && !s.openPosition && (
                <div style={{ color:C.muted, textAlign:"center", padding:40 }}>कोई closed trade नहीं।</div>
              )}
              {s.trades.map((t, i) => (
                <div key={i} style={{ background:"#04130b", border:"1px solid #166534", borderRadius:10, padding:"10px 14px" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6, flexWrap:"wrap", gap:6 }}>
                    <span style={{ color:"#86efac", fontWeight:700, fontSize:13 }}>#{s.trades.length-i} — {fmtD(t.entryDate)} → {fmtD(t.exitDate)}</span>
                    <span style={{ background:"#052e16", color:C.buy, border:"1px solid #166534", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>🎯 +{t.pct.toFixed(2)}%</span>
                  </div>
                  <div style={{ display:"flex", gap:20, fontSize:12, color:"#94a3b8", flexWrap:"wrap" }}>
                    <span>Buy @ <b style={{color:C.buy}}>₹{fmtN(t.entry)}</b></span>
                    <span>Exit @ <b style={{color:C.gtt}}>₹{fmtN(t.exit)}</b></span>
                    <span>Held: <b>{t.days}</b> दिन</span>
                  </div>
                </div>
              ))}
              {s.openPosition && (
                <div style={{ background:"#1c1407", border:"1px solid #78350f", borderRadius:10, padding:"10px 14px" }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                    <span style={{ color:"#fde68a", fontWeight:700, fontSize:13 }}>OPEN — {fmtD(s.openPosition.entryDate)}</span>
                    <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>⏳ HOLDING</span>
                  </div>
                  <div style={{ display:"flex", gap:20, fontSize:12, color:"#94a3b8", flexWrap:"wrap" }}>
                    <span>Buy @ <b style={{color:C.buy}}>₹{fmtN(s.openPosition.entry)}</b></span>
                    <span>Target @ <b style={{color:C.gtt}}>₹{fmtN(s.openPosition.target)}</b></span>
                  </div>
                </div>
              )}
            </div>
          )}
          {view === "log" && (
            <div style={{ padding:"0 16px 20px", display:"flex", flexDirection:"column", gap:8 }}>
              {events.length === 0 && <div style={{ color:C.muted, textAlign:"center", padding:40 }}>कोई event नहीं।</div>}
              {events.map((r, i) => (
                <div key={i} style={{
                  background: r.events.includes("target") ? "#120d00" : r.events.includes("buy") ? "#04130b" : C.card,
                  border: `1px solid ${r.events.includes("target") ? "#78350f" : r.events.includes("buy") ? "#166534" : C.border}`,
                  borderRadius:10, padding:"10px 14px"
                }}>
                  <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6, flexWrap:"wrap", gap:6 }}>
                    <span style={{ color:C.dim, fontWeight:700, fontSize:13, fontFamily:"monospace" }}>{fmtD(r.date)}</span>
                    <span style={{ display:"flex", gap:6 }}>
                      {r.events.includes("gtt-placed") && <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>🔔 GTT</span>}
                      {r.events.includes("buy") && <span style={{ background:"#052e16", color:C.buy, border:"1px solid #166534", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>✅ BUY</span>}
                      {r.events.includes("target") && <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:20, padding:"2px 10px", fontSize:11, fontWeight:700 }}>🎯 TARGET</span>}
                    </span>
                  </div>
                  <div style={{ display:"flex", gap:20, fontSize:12, color:"#94a3b8", flexWrap:"wrap" }}>
                    <span>H: ₹{fmtN(r.high)}</span>
                    <span>L: ₹{fmtN(r.low)}</span>
                    <span>C: ₹{fmtN(r.close)}</span>
                    {r.gttPrice && <span>GTT @ <b style={{color:C.gtt}}>₹{fmtN(r.gttPrice)}</b></span>}
                    {r.position && <span>Target @ <b style={{color:"#93c5fd"}}>₹{fmtN(r.position.target)}</b></span>}
                  </div>
                </div>
              ))}
            </div>
          )}
          {view === "table" && (
            <div style={{ overflowX:"auto", padding:"0 0 20px" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
                <thead>
                  <tr style={{ background:C.card }}>
                    {["Date","Close","20D Low","20D High","GTT Price","Event"].map(h => (
                      <th key={h} style={{ padding:"8px", textAlign:["Date","Event"].includes(h)?"left":"right", color:C.muted, fontWeight:600, borderBottom:`1px solid ${C.border}`, whiteSpace:"nowrap", fontSize:10 }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {[...s.rows].reverse().map((r, i) => {
                    const isBuy = r.events?.includes("buy"), isTarget = r.events?.includes("target"), isGtt = r.events?.includes("gtt-placed");
                    const bg = isTarget ? C.gttBg : isBuy ? C.buyBg : "transparent";
                    return (
                      <tr key={i} style={{ background: bg, borderBottom:`1px solid #0d1a2a` }}>
                        <td style={{ padding:"6px 8px", color:C.dim, whiteSpace:"nowrap", fontFamily:"monospace", fontSize:10 }}>{fmtD(r.date)}</td>
                        <td style={{ padding:"6px 8px", textAlign:"right", fontWeight:600, fontFamily:"monospace" }}>{fmtN(r.close)}</td>
                        <td style={{ padding:"6px 8px", textAlign:"right", color:C.low, fontFamily:"monospace" }}>{r.d20L ? fmtN(r.d20L) : "—"}</td>
                        <td style={{ padding:"6px 8px", textAlign:"right", color:C.high, fontFamily:"monospace" }}>{r.d20H ? fmtN(r.d20H) : "—"}</td>
                        <td style={{ padding:"6px 8px", textAlign:"right", color:C.gtt, fontFamily:"monospace" }}>{r.gttPrice ? fmtN(r.gttPrice) : "—"}</td>
                        <td style={{ padding:"6px 8px", fontSize:10, whiteSpace:"nowrap" }}>
                          {isGtt && <span style={{ color:C.gtt, marginRight:6 }}>🔔 GTT</span>}
                          {isBuy && <span style={{ color:C.buy, marginRight:6 }}>✅ BUY</span>}
                          {isTarget && <span style={{ color:C.gtt }}>🎯 TARGET</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
      {modal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.8)", display:"flex", alignItems:"flex-end", zIndex:100 }}
          onClick={e => e.currentTarget===e.target && (setModal(false), setErr(""), setStockSearch(""), setShowPicker(false))}>
          <div style={{ background:"#0d1a2a", borderTop:`1px solid ${C.border}`, borderRadius:"18px 18px 0 0", padding:20, width:"100%", maxHeight:"90vh", overflowY:"auto" }}>
            <div style={{ fontWeight:700, fontSize:16, marginBottom:18 }}>📥 Stock Data Add करें</div>
            <label style={{ fontSize:12, color:C.muted, display:"block", marginBottom:4 }}>🔍 Nifty 200 से चुनें</label>
            <div style={{ position:"relative", marginBottom:10 }}>
              <input
                value={stockSearch}
                onChange={e => { setStockSearch(e.target.value); setShowPicker(true); }}
                onFocus={() => { if (stockSearch) setShowPicker(true); }}
                onBlur={() => setTimeout(() => setShowPicker(false), 180)}
                placeholder="Type करें: RELIANCE, TCS, NTPC, Infosys..."
                style={{ width:"100%", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:14, boxSizing:"border-box", outline:"none" }}
              />
              {showPicker && stockSearch && (() => {
                const q = stockSearch.toLowerCase();
                const hits = NIFTY200.filter(st =>
                  st.sym.toLowerCase().includes(q) || st.name.toLowerCase().includes(q)
                ).slice(0, 12);
                return (
                  <div style={{ position:"absolute", top:"calc(100% + 4px)", left:0, right:0, background:"#0a1628", border:`1px solid ${C.border}`, borderRadius:8, maxHeight:220, overflowY:"auto", zIndex:200 }}>
                    {hits.length === 0 && (
                      <div style={{ padding:"10px 12px", color:C.muted, fontSize:12 }}>कोई result नहीं</div>
                    )}
                    {hits.map(st => (
                      <div key={st.sym}
                        onMouseDown={e => e.preventDefault()}
                        onClick={() => { setLabel("NSE:"+st.sym); setStockSearch(st.sym+" – "+st.name); setShowPicker(false); }}
                        style={{ padding:"9px 12px", cursor:"pointer", borderBottom:`1px solid #1a2e47`, display:"flex", gap:10, alignItems:"center" }}>
                        <span style={{ color:"#93c5fd", fontWeight:700, fontSize:12, minWidth:100, fontFamily:"monospace" }}>{st.sym}</span>
                        <span style={{ color:C.muted, fontSize:11 }}>{st.name}</span>
                      </div>
                    ))}
                  </div>
                );
              })()}
            </div>
            <label style={{ fontSize:12, color:C.muted, display:"block", marginBottom:4 }}>Stock का नाम</label>
            <input value={label} onChange={e=>setLabel(e.target.value)} placeholder="जैसे: NSE:RELIANCE"
              style={{ width:"100%", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:14, boxSizing:"border-box", marginBottom:14, outline:"none" }} />
            <label style={{ fontSize:12, color:C.muted, display:"block", marginBottom:4 }}>CSV File Upload</label>
            <input type="file" accept=".csv,.txt" onChange={onFile}
              style={{ width:"100%", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:13, boxSizing:"border-box", marginBottom:10 }} />
            <label style={{ fontSize:12, color:C.muted, display:"block", marginBottom:4 }}>या CSV Paste करें</label>
            <textarea value={csvTxt} onChange={e=>setCsvTxt(e.target.value)} rows={9}
              placeholder={"Date,Open,High,Low,Close,Volume\n9/15/2025 15:30:00,331,333.8,330.65,331.1,6566824"}
              style={{ width:"100%", background:C.bg, border:`1px solid ${C.border}`, borderRadius:8, padding:"10px 12px", color:C.text, fontSize:11, fontFamily:"monospace", resize:"vertical", boxSizing:"border-box", marginBottom:10, outline:"none" }} />
            {err && (
              <div style={{ color:"#f87171", background:"rgba(239,68,68,.1)", border:"1px solid rgba(239,68,68,.3)", borderRadius:8, padding:"8px 12px", fontSize:12, marginBottom:12 }}>❌ {err}</div>
            )}
            <div style={{ display:"flex", gap:10 }}>
              <button onClick={() => { setModal(false); setErr(""); setStockSearch(""); setShowPicker(false); }}
                style={{ flex:1, background:C.border, color:C.text, border:"none", borderRadius:10, padding:12, fontSize:14, cursor:"pointer" }}>Cancel</button>
              <button onClick={submitAdd}
                style={{ flex:2, background:C.accent, color:"#fff", border:"none", borderRadius:10, padding:12, fontSize:14, fontWeight:700, cursor:"pointer" }}>✅ Backtest चलाओ</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
