const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5mVZIErWjOyKpAkZItpr3X69fgJ2Id0f2wkKLCQcd1pd0sfupIkJ5k3pxsldcx9J-/exec";
const SHEET_TAB = "20 DAY TESTING";

const DEFAULT_EPS = 0.03;
const DEFAULT_FIXED_AMOUNT = 25000;
const DEFAULT_TARGETS = [0.20, 0.15, 0.10];
const MAX_BUYS = 3;

function fmtD(d) { return d ? new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"2-digit" }) : "—"; }
function fmtDISODate(d) { if (!d) return ""; const dt=new Date(d); return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function fmtN(v,dec) { return (v==null||isNaN(v)) ? "—" : Number(v).toFixed(dec==null?2:dec); }
function fmtRs(v) { if (v==null||isNaN(v)) return "—"; var n=Number(v), sign=n<0?"-":""; return sign+"₹"+Math.abs(Math.round(n)).toLocaleString("en-IN"); }
function inr(v) { return (v==null||isNaN(v)) ? "—" : Number(v).toLocaleString("en-IN",{maximumFractionDigits:2}); }
function csvEsc(v) { if (v==null) return ""; var s=String(v); return (s.indexOf(",")>=0||s.indexOf('"')>=0||s.indexOf("\n")>=0) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadCSV(filename, rows) {
  var csv = rows.map(function(r){ return r.map(csvEsc).join(","); }).join("\n");
  var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
}
function dateStamp() { var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function parseDateCell(s) {
  if (s == null) return null;
  const str = String(s).trim();
  if (!str) return null;
  if (str.indexOf("/")===-1 && str.indexOf("-")===-1 && str.indexOf(":")===-1) {
    const n = parseFloat(str);
    if (!isNaN(n) && n>25000 && n<100000) {
      const d = new Date((n-25569)*86400*1000);
      if (!isNaN(d.getTime())) return d;
    }
  }
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

async function fetchViaProxy(url) {
  const proxies = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://api.cors.lol/?url=" + encodeURIComponent(url),
    "https://thingproxy.freeboard.io/fetch/" + url,
    "https://corsproxy.io/?url=" + encodeURIComponent(url),
  ];
  let lastErr = "";
  for (let i = 0; i < proxies.length; i++) {
    try {
      const res = await fetch(proxies[i]);
      if (!res.ok) { lastErr = "HTTP " + res.status; continue; }
      const text = await res.text();
      if (text && text.length > 20) return text;
    } catch (e) { lastErr = e.message; }
  }
  throw new Error("Data नहीं मिला (" + lastErr + ")");
}

async function fetchFromYahoo(sym, range) {
  const clean = String(sym).toUpperCase().replace(/^NSE:/, "").trim();
  const ySym = clean + ".NS";
  const rng = range || DEFAULT_RANGE;
  const yUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + ySym + "?interval=1d&range=" + rng;
  const text = await fetchViaProxy(yUrl);
  let json;
  try { json = JSON.parse(text); } catch (e) { throw new Error("Yahoo response गलत"); }
  const r = json && json.chart && json.chart.result && json.chart.result[0];
  if (!r) throw new Error("Symbol गलत है या NSE पर listed नहीं");
  const ts = r.timestamp || [];
  const q = (r.indicators && r.indicators.quote && r.indicators.quote[0]) || {};
  const lines = ["Date,Open,High,Low,Close,Volume"];
  for (let i = 0; i < ts.length; i++) {
    const d = new Date(ts[i] * 1000);
    const ds = (d.getMonth()+1)+"/"+d.getDate()+"/"+d.getFullYear();
    const o=q.open?q.open[i]:null, h=q.high?q.high[i]:null, l=q.low?q.low[i]:null, c=q.close?q.close[i]:null;
    const v = q.volume ? q.volume[i] : 0;
    if (o==null||h==null||l==null||c==null) continue;
    lines.push(ds+","+o+","+h+","+l+","+c+","+(v||0));
  }
  if (lines.length < 21) throw new Error("कम data मिला (" + (lines.length-1) + " rows)");
  return { csv: lines.join("\n"), name: "NSE:" + clean, rows: lines.length - 1 };
}

async function fetchSheetStocks() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_") === 0) throw new Error("Apps Script URL set नहीं किया");
  const sep = APPS_SCRIPT_URL.indexOf("?") >= 0 ? "&" : "?";
  const url = APPS_SCRIPT_URL + sep + "tab=" + encodeURIComponent(SHEET_TAB);
  const res = await fetch(url);
  if (!res.ok) throw new Error("Apps Script HTTP " + res.status);
  const json = await res.json();
  if (json && json.error) throw new Error(json.error);

  let raw = "", name = "", bohText = "", suitable = true;
  if (typeof json === "string") raw = json;
  else if (json && json.a2 != null) raw = json.a2;
  else if (json && json.symbol != null) raw = json.symbol;
  else if (json && Array.isArray(json.values) && json.values.length >= 1) {
    const a2row = json.values[1] || json.values[0];
    raw = a2row && a2row[0];
  } else if (json && Array.isArray(json.stocks) && json.stocks.length) {
    const first = json.stocks[0];
    if (first && typeof first === "object") {
      const keys = Object.keys(first);
      const sk = keys.find(function(k){ return /symbol|sym|ticker|stock|scrip/i.test(k); }) || keys[0];
      raw = first[sk];
      const nk = keys.find(function(k){ return /name|company/i.test(k); });
      if (nk) name = String(first[nk] || "").trim();
    } else raw = first;
  } else if (json && Array.isArray(json) && json.length) raw = json[0];

  const sym = String(raw || "").trim().toUpperCase().replace(/\.NS$|^NSE:/i, "");
  if (!sym || !/^[A-Z0-9&\-]+$/.test(sym)) {
    throw new Error('A2 में valid stock symbol नहीं मिला (मिला: "' + String(raw) + '")');
  }
  if (!name) name = sym;

  return {
    stocks: [{ sym: sym, name: name, suitable: suitable, bohText: bohText }],
    cols: ["Symbol"], totalRows: 1, hasBoh: !!bohText,
  };
}

function parseCSV(raw, minPeriod) {
  if (!raw || !raw.trim()) return { error: "CSV खाली है।" };
  minPeriod = minPeriod || DEFAULT_PERIOD;
  const lines = raw.trim().split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
  let stockName = "", hIdx = -1;
  for (let i = 0; i < Math.min(lines.length, 12); i++) {
    if (/^date/i.test(lines[i])) { hIdx = i; break; }
    const p = lines[i].split(",");
    const cell = p[0] ? p[0].trim() : "";
    if (cell && !/^\d/.test(cell) && !/\*/.test(cell) && cell.length > 1 && cell.toUpperCase() !== "STOCK") stockName = cell;
  }
  if (hIdx === -1) return { error: 'Header row "Date,Open,High,Low,Close" नहीं मिला।' };
  const hdr = lines[hIdx].split(",").map(function(h){ return h.trim().toLowerCase(); });
  const gi = function(){
    for (let j = 0; j < arguments.length; j++) {
      const x = hdr.indexOf(arguments[j]);
      if (x >= 0) return x;
    }
    return -1;
  };
  const di=gi("date","datetime","time"), oi=gi("open"), hi=gi("high"), li=gi("low"), ci=gi("close"), vi=gi("volume","vol");
  if ([di,hi,li].some(function(x){ return x < 0; })) return { error: "Date / High / Low columns नहीं मिले।" };
  const rows = [];
  for (let i = hIdx+1; i < lines.length; i++) {
    const p = lines[i].split(",");
    if (p.length < 4) continue;
    const ds = p[di] ? p[di].trim() : "";
    if (!ds) continue;
    const d = parseDateCell(ds);
    if (!d) continue;
    const high=parseFloat(p[hi]), low=parseFloat(p[li]);
    const close = ci>=0 ? parseFloat(p[ci]) : high;
    const open  = oi>=0 ? parseFloat(p[oi]) : close;
    const vol   = vi>=0 ? (parseInt(p[vi])||0) : 0;
    if (isNaN(high) || isNaN(low)) continue;
    rows.push({ date: d, open: open, high: high, low: low, close: close, vol: vol, ts: d.getTime() });
  }
  rows.sort(function(a,b){ return a.ts - b.ts; });
  if (rows.length < minPeriod) return { error: "कम से कम " + minPeriod + " rows चाहिए। मिले: " + rows.length };
  return { stockName: stockName, rows: rows };
}

function calcSignals(rows, period, eps, fixedAmount, targetSteps) {
  period = period || DEFAULT_PERIOD;
  eps = eps == null ? DEFAULT_EPS : eps;
  fixedAmount = fixedAmount || DEFAULT_FIXED_AMOUNT;
  targetSteps = targetSteps || DEFAULT_TARGETS;

  const enriched = rows.map(function(r, i) {
    if (i < period - 1) return Object.assign({}, r, { d20L: null, d20H: null, prevD20H: null, newLow: false, events: [], gttPrice: null });
    const win = rows.slice(i - period + 1, i + 1);
    const d20L = Math.min.apply(null, win.map(function(x){ return x.low; }));
    const d20H = Math.max.apply(null, win.map(function(x){ return x.high; }));
    return Object.assign({}, r, { d20L: d20L, d20H: d20H, prevD20H: null, newLow: r.low <= d20L + eps, events: [], gttPrice: null });
  });
  for (let i = 1; i < enriched.length; i++) {
    if (enriched[i-1].d20H != null) enriched[i].prevD20H = enriched[i-1].d20H;
  }

  let buys = [], totalShares = 0, totalCost = 0, avgPrice = 0, targetPrice = 0;
  let currentTargetPct = 0, gttActive = false;
  const trades = [];

  function doExit(r) {
    const exitPrice = targetPrice;
    r.events.push("target");
    trades.push({
      buys: buys.slice(), entryDate: buys[0].date, exitDate: r.date,
      numBuys: buys.length, shares: totalShares, cost: totalCost,
      exit: exitPrice, proceeds: totalShares * exitPrice,
      pnl: totalShares * exitPrice - totalCost,
      pct: (exitPrice / avgPrice - 1) * 100,
      targetPct: currentTargetPct,
      days: Math.round((r.ts - buys[0].date.getTime()) / 86400000)
    });
    buys = []; totalShares = 0; totalCost = 0; avgPrice = 0; targetPrice = 0;
    currentTargetPct = 0; gttActive = false;
  }

  for (let i = 0; i < enriched.length; i++) {
    const r = enriched[i];
    if (r.d20H == null) continue;

    if (totalShares > 0 && r.high >= targetPrice - eps) { doExit(r); continue; }

    if (gttActive) {
      const trigger = r.prevD20H;
      if (trigger != null && r.high >= trigger - eps) {
        const qty = Math.max(1, Math.floor(fixedAmount / trigger));
        const buyIdx = buys.length;
        buys.push({ date: r.date, price: trigger, qty: qty, buyIdx: buyIdx });
        totalShares += qty; totalCost += qty * trigger;
        avgPrice = totalCost / totalShares;
        currentTargetPct = targetSteps[Math.min(buyIdx, targetSteps.length - 1)];
        targetPrice = avgPrice * (1 + currentTargetPct);
        gttActive = false;
        r.events.push(buyIdx === 0 ? "buy" : ("buy" + (buyIdx + 1)));
        r.gttPrice = trigger; r.buyPrice = trigger; r.buyQty = qty; r.buyIdx = buyIdx;
        r.position = { avgPrice: avgPrice, target: targetPrice, shares: totalShares, buys: buys.length, targetPct: currentTargetPct };
        if (r.high >= targetPrice - eps) doExit(r);
        continue;
      }
      r.gttPrice = r.d20H;
      continue;
    }

    if (r.newLow && buys.length < MAX_BUYS) {
      gttActive = true;
      r.events.push("gtt-placed");
      r.gttPrice = r.d20H;
      continue;
    }

    if (totalShares > 0) {
      r.position = { avgPrice: avgPrice, target: targetPrice, shares: totalShares, buys: buys.length, targetPct: currentTargetPct };
    }
  }

  let openPosition = null;
  if (totalShares > 0) {
    openPosition = {
      buys: buys.slice(), avgPrice: avgPrice, target: targetPrice, shares: totalShares,
      cost: totalCost, targetPct: currentTargetPct,
      entryDate: buys[0].date, numBuys: buys.length
    };
  }
  let pendingGtt = null;
  if (gttActive) {
    const last = enriched[enriched.length - 1];
    pendingGtt = { price: last.d20H, date: last.date };
  }
  return { rows: enriched, trades: trades, openPosition: openPosition, pendingGtt: pendingGtt, fixedAmount: fixedAmount };
}

function calcPortfolioStats(stocks) {
  if (!stocks || !stocks.length) return null;
  var totalTrades=0, wins=0, losses=0, grossWin=0, grossLoss=0;
  var heldDays=0, openCount=0, gttCount=0, idleCount=0;
  var totalInvestedRs=0, totalProfitRs=0, totalReturnedRs=0;
  var perStock = [];
  for (var i = 0; i < stocks.length; i++) {
    var s = stocks[i];
    var t = s.trades || [];
    var w=0, l=0, sw=0, sl=0, d=0;
    var investedRs=0, returnedRs=0, profitRs=0;
    for (var j = 0; j < t.length; j++) {
      var tr = t[j];
      if (tr.pnl > 0) { w++; sw += tr.pct; } else { l++; sl += Math.abs(tr.pct); }
      d += (tr.days || 0);
      investedRs += tr.cost; returnedRs += tr.proceeds; profitRs += tr.pnl;
    }
    totalTrades += t.length; wins += w; losses += l;
    grossWin += sw; grossLoss += sl; heldDays += d;
    totalInvestedRs += investedRs; totalReturnedRs += returnedRs; totalProfitRs += profitRs;
    var status = s.openPosition ? "HOLDING" : (s.pendingGtt ? "GTT" : "IDLE");
    if (s.openPosition) openCount++; else if (s.pendingGtt) gttCount++; else idleCount++;
    var lastRow = s.rows && s.rows.length ? s.rows[s.rows.length - 1] : null;
    perStock.push({
      name: s.name, trades: t.length, wins: w, losses: l,
      winRate: t.length ? (w / t.length) * 100 : 0,
      netPct: sw - sl, status: status,
      lastClose: lastRow ? lastRow.close : null,
      amount: s.amount || DEFAULT_FIXED_AMOUNT,
      investedRs: investedRs, returnedRs: returnedRs, profitRs: profitRs,
      buysOpen: s.openPosition ? s.openPosition.numBuys : 0
    });
  }
  var winRate = totalTrades ? (wins / totalTrades) * 100 : 0;
  var profitFactor = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0);
  return {
    totalStocks: stocks.length, totalTrades: totalTrades, wins: wins, losses: losses,
    winRate: winRate, grossWin: grossWin, grossLoss: grossLoss,
    netPct: grossWin - grossLoss, profitFactor: profitFactor,
    openCount: openCount, gttCount: gttCount, idleCount: idleCount,
    avgHeldDays: totalTrades ? heldDays / totalTrades : 0,
    totalInvestedRs: totalInvestedRs, totalReturnedRs: totalReturnedRs, totalProfitRs: totalProfitRs,
    perStock: perStock
  };
}

function calcEquityCurve(stocks) {
  if (!stocks || !stocks.length) return null;
  var allTrades = [];
  for (var i = 0; i < stocks.length; i++) {
    var s = stocks[i];
    (s.trades || []).forEach(function(t){
      allTrades.push({ ts: t.exitDate.getTime(), date: t.exitDate, profit: t.pnl, stock: s.name });
    });
  }
  if (!allTrades.length) return null;
  allTrades.sort(function(a,b){ return a.ts - b.ts; });
  var pts = []; var cum=0, peak=0, maxDD=0;
  for (var k = 0; k < allTrades.length; k++) {
    cum += allTrades[k].profit;
    if (cum > peak) peak = cum;
    var dd = peak - cum;
    if (dd > maxDD) maxDD = dd;
    pts.push({ ts: allTrades[k].ts, date: allTrades[k].date, profit: allTrades[k].profit, cum: cum, peak: peak, dd: dd, stock: allTrades[k].stock });
  }
  return { points: pts, maxDrawdown: maxDD, peakEquity: peak, finalEquity: cum, tradeCount: allTrades.length };
}

function calcScreenerRow(stock) {
  var rows = stock.rows;
  var last = rows[rows.length - 1];
  var status = "IDLE", label = "⏳ IDLE", priority = 4, detail = "";
  if (stock.openPosition) {
    status = "HOLDING"; label = "📈 HOLDING"; priority = 2;
    detail = "Buys " + stock.openPosition.numBuys + "/3 · Avg ₹" + fmtN(stock.openPosition.avgPrice) + " → T ₹" + fmtN(stock.openPosition.target);
  } else if (stock.pendingGtt) {
    status = "GTT"; label = "🔔 GTT Active"; priority = 3;
    detail = "GTT @ ₹" + fmtN(stock.pendingGtt.price);
  }
  for (var i = rows.length - 1; i >= Math.max(0, rows.length - 10); i--) {
    var r = rows[i];
    var re = r.events || [];
    var buyEv = re.find(function(e){ return /^buy/.test(e); });
    if (buyEv) {
      var ago = rows.length - 1 - i;
      if (ago <= 1) {
        status = "BUY_TODAY"; label = "✅ " + (buyEv==="buy"?"BUY":("BUY" + buyEv.slice(3))); priority = 0;
        detail = buyEv + " @ ₹" + fmtN(r.buyPrice) + " × " + r.buyQty;
      }
      break;
    }
    if (re.indexOf("target") >= 0) {
      var ago2 = rows.length - 1 - i;
      if (ago2 <= 1) { status = "TARGET_TODAY"; label = "🎯 TARGET"; priority = 0; detail = "Target hit"; }
      break;
    }
    if (re.indexOf("gtt-placed") >= 0) {
      var ago3 = rows.length - 1 - i;
      if (ago3 <= 1 && status === "IDLE") { status = "NEW_LOW"; label = "🆕 New Low"; priority = 1; detail = "नया Low → GTT लगा"; }
      break;
    }
  }
  return {
    name: stock.name, status: status, label: label, priority: priority, detail: detail,
    close: last.close, d20H: last.d20H, d20L: last.d20L, date: last.date,
    gtt: stock.pendingGtt ? stock.pendingGtt.price : null,
    target: stock.openPosition ? stock.openPosition.target : null,
    avg: stock.openPosition ? stock.openPosition.avgPrice : null,
    numBuys: stock.openPosition ? stock.openPosition.numBuys : 0,
    amount: stock.amount || DEFAULT_FIXED_AMOUNT
  };
}

function MiniChart(props) {
  var rows = props.rows, chartType = props.chartType || "candle", period = props.period || DEFAULT_PERIOD, height = props.height || 320;
  var hov = React.useState(null); var hover = hov[0]; var setHover = hov[1];
  var W=800, H=height, PAD={l:50,r:10,t:20,b:30};
  var iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  var data = rows.filter(function(r){ return r.d20H != null; });
  if (!data.length) return null;
  var allVals=[]; data.forEach(function(r){ allVals.push(r.close,r.d20H,r.d20L,r.high,r.low); });
  var minV=Math.min.apply(null,allVals), maxV=Math.max.apply(null,allVals), range=(maxV-minV)||1;
  var minT=data[0].ts, maxT=data[data.length-1].ts;
  var x=function(ts){ return PAD.l+((ts-minT)/(maxT-minT))*iw; };
  var y=function(v){ return PAD.t+ih-((v-minV)/range)*ih; };
  var slot=iw/data.length, bodyW=Math.max(1,Math.min(10,slot*0.7));
  var line=function(key){ return data.map(function(r,i){ return (i?'L':'M')+x(r.ts).toFixed(1)+","+y(r[key]).toFixed(1); }).join(" "); };
  var yLabels=[]; for (var i=0;i<=4;i++) yLabels.push(minV+(range*i/4));
  var xticks=Math.min(6,data.length), xIdx=[];
  for (var j=0;j<xticks;j++) xIdx.push(Math.floor(j*(data.length-1)/(xticks-1||1)));
  return (
    <div style={{overflowX:"auto"}}>
      <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",minWidth:340,height:height,display:"block"}}>
        {yLabels.map(function(v,k){
          return <g key={k}><line x1={PAD.l} x2={W-PAD.r} y1={y(v)} y2={y(v)} stroke="#101f35" strokeDasharray="3 3"/>
          <text x={PAD.l-4} y={y(v)+3} fill="#334a6a" fontSize="10" textAnchor="end">{"₹"+v.toFixed(0)}</text></g>;
        })}
        {xIdx.map(function(idx,k){
          return <text key={k} x={x(data[idx].ts)} y={H-10} fill="#334a6a" fontSize="9" textAnchor="middle">
            {(data[idx].date.getMonth()+1)+"/"+String(data[idx].date.getFullYear()).slice(2)}</text>;
        })}
        {chartType==="candle" && data.map(function(r,k){
          var cx=x(r.ts), up=r.close>=r.open, col=up?"#22c55e":"#ef4444";
          var top=up?y(r.close):y(r.open), bot=up?y(r.open):y(r.close), bh=Math.max(1,bot-top);
          return <g key={"c"+k}><line x1={cx} x2={cx} y1={y(r.high)} y2={y(r.low)} stroke={col} strokeWidth="1"/>
          <rect x={cx-bodyW/2} y={top} width={bodyW} height={bh} fill={col} stroke={col} strokeWidth="0.5"/></g>;
        })}

  const perSt = React.useState(initSettings.period); var period = perSt[0], setPeriod = perSt[1];
  const epSt = React.useState(initSettings.eps); var eps = epSt[0], setEps = epSt[1];
  const amSt = React.useState(initSettings.fixedAmount); var fixedAmount = amSt[0], setFixedAmount = amSt[1];
  const tSt = React.useState(initSettings.targetSteps); var targetSteps = tSt[0], setTargetSteps = tSt[1];
  const soSt = React.useState(false); var settingsOpen = soSt[0], setSettingsOpen = soSt[1];

  function showToast(msg, type) { setToast({msg, type: type||"info"}); setTimeout(function(){ setToast(null); }, 3500); }

  function persistStocks(list){
    try {
      var slim = list.map(function(s){
        return {
          name: s.name, amount: s.amount || fixedAmount,
          rawRows: (s.rawRows||[]).map(function(r){
            return { date: r.date instanceof Date ? r.date.toISOString() : r.date, open: r.open, high: r.high, low: r.low, close: r.close, vol: r.vol, ts: r.ts };
          })
        };
      });
      localStorage.setItem(STOCKS_KEY, JSON.stringify(slim));
    } catch(e) {}
  }
  function persistSettings(p,e,a,steps,r){
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ period:p, eps:e, fixedAmount:a, targetSteps:steps, range:r })); } catch(err) {}
  }

  async function loadSheet(){
    setSheetInfo(function(prev){ return Object.assign({}, prev, { loading:true, error:null }); });
    try {
      const r = await fetchSheetStocks();
      setStockList(r.stocks);
      setSheetInfo({ loading:false, error:null, source:"sheet" });
      showToast("✅ Sheet A2 → " + (r.stocks[0] ? r.stocks[0].sym : "—"), "success");
    } catch (e) {
      console.error("Sheet fetch failed:", e);
      setStockList(FALLBACK_STOCKS.slice());
      setSheetInfo({ loading:false, error:e.message, source:"fallback" });
      showToast("⚠ Sheet fail: " + e.message, "error");
    }
  }

  async function addStockAuto(stock){
    setLoadingSym(stock.sym);
    try {
      const r = await fetchFromYahoo(stock.sym, range);
      const parsed = parseCSV(r.csv, period);
      if (parsed.error) throw new Error(parsed.error);
      const rawRows = parsed.rows;
      const res = calcSignals(rawRows, period, eps, fixedAmount, targetSteps);
      setStocks(function(p){
        const name = "NSE:" + stock.sym;
        const idx = p.findIndex(function(x){ return x.name === name; });
        const newStock = {
          name: name, amount: idx >= 0 ? p[idx].amount : fixedAmount,
          rawRows: rawRows, rows: res.rows, trades: res.trades,
          openPosition: res.openPosition, pendingGtt: res.pendingGtt
        };
        const next = idx >= 0 ? p.map(function(x,j){ return j===idx ? newStock : x; }) : p.concat([newStock]);
        setActive(idx >= 0 ? idx : next.length-1);
        persistStocks(next);
        return next;
      });
      showToast("✅ " + stock.sym + " loaded (" + res.trades.length + " trades)", "success");
      setLoadingSym(null);
      return true;
    } catch (e) {
      showToast("❌ " + stock.sym + ": " + e.message, "error");
      setLoadingSym(null);
      return false;
    }
  }
  async function pickFromList(stock){ const ok = await addStockAuto(stock); if (ok) setListOpen(false); }

  function handleAdd(csvRaw, lbl){
    setErr("");
    var parsed = parseCSV(csvRaw, period);
    if (parsed.error) { setErr(parsed.error); return false; }
    var res = calcSignals(parsed.rows, period, eps, fixedAmount, targetSteps);
    var name = (lbl && lbl.trim()) || parsed.stockName || ("Stock " + (stocks.length+1));
    setStocks(function(p){
      var next = p.concat([{ name:name, amount:fixedAmount, rawRows:parsed.rows,
        rows:res.rows, trades:res.trades, openPosition:res.openPosition, pendingGtt:res.pendingGtt }]);
      persistStocks(next);
      return next;
    });
    setActive(stocks.length);
    return true;
  }
  function submitAdd(){ if (handleAdd(csvTxt, label)) { setCsvTxt(""); setLabel(""); setModal(false); } }

  function updateAmount(idx, newAmount){
    setStocks(function(p){
      var copy = p.slice();
      if (!copy[idx]) return p;
      var s = copy[idx];
      var res = calcSignals(s.rawRows, period, eps, newAmount, targetSteps);
      copy[idx] = Object.assign({}, s, {
        amount: newAmount, rows: res.rows, trades: res.trades,
        openPosition: res.openPosition, pendingGtt: res.pendingGtt
      });
      persistStocks(copy);
      return copy;
    });
  }
  function removeStock(idx){
    setStocks(function(p){ var next=p.filter(function(_,i){ return i!==idx; }); persistStocks(next); return next; });
    setActive(function(a){ return Math.max(0, a>=idx ? a-1 : a); });
  }
  function clearAll(){
    if (!confirm("सारे loaded stocks हटा दें?")) return;
    setStocks([]); setActive(0);
    try { localStorage.removeItem(STOCKS_KEY); } catch(e) {}
    showToast("🗑 सारे stocks हटा दिए", "success");
  }
  function onFile(e){ var f=e.target.files&&e.target.files[0]; if (!f) return; var rd=new FileReader(); rd.onload=function(ev){ setCsvTxt(ev.target.result); }; rd.readAsText(f); }

  function applySettings(newPeriod, newEps, newAmount, newTargetSteps){
    setPeriod(newPeriod); setEps(newEps); setFixedAmount(newAmount); setTargetSteps(newTargetSteps);
    persistSettings(newPeriod, newEps, newAmount, newTargetSteps, range);
    setStocks(function(prev){
      const next = prev.map(function(s){
        if (!s.rawRows || s.rawRows.length < newPeriod) return s;
        var res = calcSignals(s.rawRows, newPeriod, newEps, s.amount || newAmount, newTargetSteps);
        return Object.assign({}, s, { rows:res.rows, trades:res.trades, openPosition:res.openPosition, pendingGtt:res.pendingGtt });
      });
      persistStocks(next);
      return next;
    });
    setSettingsOpen(false);
    showToast("⚙️ Saved", "success");
  }

  useEffect(function(){
    try {
      var raw = localStorage.getItem(SETTINGS_KEY);
      if (raw) { var s = JSON.parse(raw); if (s.range) setRange(s.range); }
    } catch(e) {}
    try {
      var rawS = localStorage.getItem(STOCKS_KEY);
      if (rawS) {
        var list = JSON.parse(rawS);
        var restored = list.map(function(s){
          var rawRows = (s.rawRows||[]).map(function(r){ return Object.assign({}, r, { date:new Date(r.date) }); });
          var amt = s.amount || fixedAmount;
          var res = calcSignals(rawRows, period, eps, amt, targetSteps);
          return { name:s.name, amount:amt, rawRows:rawRows, rows:res.rows, trades:res.trades,
            openPosition:res.openPosition, pendingGtt:res.pendingGtt };
        });
        if (restored.length) { setStocks(restored); setActive(0); showToast("♻ "+restored.length+" restored","success"); }
      }
    } catch(e) {}
    loadSheet();
  }, []);

  var s = stocks[active];
  var last = s ? s.rows[s.rows.length-1] : null;
  var C = { bg:"#080f1a", card:"#0f1e33", border:"#1e3352", accent:"#2563eb", dim:"#4a6fa5", muted:"#64748b", buy:"#4ade80", buyBg:"rgba(74,222,128,0.08)", gtt:"#fbbf24", gttBg:"rgba(251,191,36,0.08)", high:"#f87171", low:"#34d399", text:"#dce8f8", buy2:"#38bdf8", buy3:"#f472b6" };
  var card = function(sx){ return Object.assign({ background:C.card, border:"1px solid "+C.border, borderRadius:10 }, sx||{}); };
  var views = [
    {key:"chart",lbl:"📊 Chart"}, {key:"trades",lbl:"💼 Trades"}, {key:"log",lbl:"📜 Event Log"},
    {key:"table",lbl:"📋 Table"}, {key:"screener",lbl:"🔍 Screener"}, {key:"portfolio",lbl:"📊 Portfolio"}
  ];
  var events = s ? s.rows.filter(function(r){ return r.events && r.events.length; }) : [];

  return (
    <div style={{ fontFamily:"'Inter',system-ui,sans-serif", background:C.bg, color:C.text, minHeight:"100vh", fontSize:14 }}>
      <div style={{ background:C.card, padding:"10px 14px", display:"flex", alignItems:"center", gap:8, borderBottom:"1px solid "+C.border, flexWrap:"wrap" }}>
        <div style={{ flex:1, minWidth:180 }}>
          <span style={{ fontWeight:700, fontSize:15 }}>📈 {period}D Breakout + GTT</span>
          <span style={{marginLeft:8, fontSize:10, color:"#c4b5fd"}}>20/15/10% · ₹{inr(fixedAmount)}</span>
          <span style={{
            marginLeft:8, fontSize:10, padding:"2px 8px", borderRadius:20, fontWeight:700,
            background: sheetInfo.source==="sheet" ? "rgba(74,222,128,.12)" : "rgba(248,113,113,.12)",
            color: sheetInfo.source==="sheet" ? C.buy : "#f87171",
            border: "1px solid " + (sheetInfo.source==="sheet" ? "#166534" : "#7f1d1d")

            {sheetInfo.loading ? "⟳ Loading..." : sheetInfo.source==="sheet" ? ("✓ A2: "+(stockList[0]?stockList[0].sym:"—")) : "⚠ Fallback"}
          </span>
        </div>
        <select value={range} onChange={function(e){ setRange(e.target.value); persistSettings(period, eps, fixedAmount, targetSteps, e.target.value); }}
          style={{ background:C.bg, color:C.text, border:"1px solid "+C.border, borderRadius:8, padding:"6px 10px", fontSize:12, cursor:"pointer", outline:"none" }}>
          {RANGE_OPTIONS.map(function(r){ return <option key={r.key} value={r.key}>{r.label}</option>; })}
        </select>
        <button onClick={function(){ setListOpen(true); }}
          style={{ background:"none", color:"#93c5fd", border:"1px solid "+C.border, borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer" }}>

        </button>

            style={{ background:"none", color:"#93c5fd", border:"1px solid "+C.border, borderRadius:10, padding:"13px 26px", fontSize:15, fontWeight:700, cursor: "pointer" }}>🚀 Load A2</button>
          <button onClick={function(){ setModal(true); }}
            style={{ background:C.accent, color:"#fff", border:"none", borderRadius:10, padding:"13px 26px", fontSize:15, fontWeight:700, cursor:"pointer" }}>+ CSV</button>
        </div>
      </div>}

      {s && <div>
        <div style={{ display:"flex", gap:10, padding:"14px 16px", overflowX:"auto" }}>

            { lbl:"Trades", val: s.trades.length, clr: C.buy },

            { lbl:"Close", val: "₹" + fmtN(last ? last.close : null), clr:"#93c5fd" },
            { lbl:period+"D High", val: "₹" + fmtN(last ? last.d20H : null), clr: C.high },
            { lbl:period+"D Low", val: "₹" + fmtN(last ? last.d20L : null), clr: C.low }
          ].map(function(c,i){
            return <div key={i} style={card({ padding:"10px 16px", minWidth:90, textAlign:"center", flexShrink:0 })}>

              <div style={{ fontSize:10, color:C.muted, marginTop:2 }}>{c.lbl}</div>
            </div>;

            </span>}
            {!s.openPosition && s.pendingGtt && <span style={{ background:"#1c1407", color:C.gtt, border:"1px solid #78350f", borderRadius:6, padding:"3px 10px", fontSize:12, fontWeight:700 }}>🔔 GTT @ ₹{fmtN(s.pendingGtt.price)}</span>}

              {s.openPosition.buys.map(function(b, i){

                  <span style={{ color: i===0?C.buy: i===1?C.buy2:C.buy3, fontWeight:700, minWidth:60 }}>Buy {i+1}</span>
                  <span>{fmtD(b.date)}</span>
                  <span><b style={{color:C.text}}>₹{fmtN(b.price)}</b> × {b.qty} = <b style={{color:"#93c5fd"}}>{fmtRs(b.price*b.qty)}</b></span>
                </div>;

              <div style={{ display:"flex", gap:16, fontSize:12, flexWrap:"wrap", paddingTop:6, borderTop:"1px dashed #1e3352", marginTop:6 }}>
                <span>Avg: <b style={{color:"#93c5fd"}}>₹{fmtN(s.openPosition.avgPrice)}</b> × <b>{s.openPosition.shares}</b></span>
                <span>Invested: <b style={{color:"#93c5fd"}}>{fmtRs(s.openPosition.cost)}</b></span>

        <div style={{ padding:"0 16px 12px", display:"flex", gap:6, overflowX:"auto" }}>

          <div style={card({ padding:"10px 0" })}>

              <button onClick={function(){ setChartType("line"); }} style={{ background: chartType==="line" ? C.accent : "none", color: chartType==="line" ? "#fff" : C.muted, border:"1px solid "+(chartType==="line" ? C.accent : C.border), borderRadius:6, padding:"4px 10px", fontSize:11, cursor:"pointer" }}>📈</button>

            <MiniChart rows={s.rows} chartType={chartType} period={period}/>

        {view==="trades" && <div style={{ padding:"0 16px 20px", display:"flex", flexDirection:"column", gap:8 }}>

                return <div key={bi} style={{ fontSize:11, color:"#94a3b8", marginBottom:3 }}>

            {s.openPosition.buys.map(function(b, bi){
              return <div key={bi} style={{ fontSize:11, color:"#94a3b8", marginBottom:3 }}>
                <span style={{ color: bi===0?C.buy:bi===1?C.buy2:C.buy3, fontWeight:700, marginRight:8 }}>B{bi+1}</span>
                {fmtD(b.date)} · ₹{fmtN(b.price)} × {b.qty} = {fmtRs(b.price*b.qty)}
              </div>;

          </div>}
        </div>}

        {view==="log" && <div style={{ padding:"0 16px 20px", display:"flex", flexDirection:"column", gap:8 }}>
          {events.length===0 && <div style={{ color:C.muted, textAlign:"center", padding:40 }}>कोई event नहीं।</div>}
          {events.map(function(r,i){
            return <div key={i} style={{ background:C.card, border:"1px solid "+C.border, borderRadius:10, padding:"10px 14px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>

                {r.gttPrice && <span>GTT ₹{fmtN(r.gttPrice)}</span>}
                {r.buyPrice && <span style={{color:C.buy}}>Buy ₹{fmtN(r.buyPrice)} × {r.buyQty}</span>}
              </div>
            </div>;
          })}
        </div>}

        {view==="table" && <div style={{ padding:"0 0 20px" }}>
          <div style={{padding:"0 16px 8px"}}><ExportBtn label="📥 Export" onClick={function(){ exportTable(s); }}/></div>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11 }}>
              <thead><tr style={{ background:C.card }}>
                {["Date","Close",period+"D L",period+"D H","GTT","Buy","Qty","Avg","Target","Event"].map(function(h){
                  return <th key={h} style={{ padding:"8px", textAlign:"right", color:C.muted, borderBottom:"1px solid "+C.border, fontSize:10 }}>{h}</th>;
                })}
              </tr></thead>
              <tbody>
                {s.rows.slice().reverse().map(function(r,i){
                  return <tr key={i} style={{ borderBottom:"1px solid #0d1a2a" }}>
                    <td style={{ padding:"6px 8px", color:C.dim, fontSize:10 }}>{fmtD(r.date)}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right" }}>{fmtN(r.close)}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:C.low }}>{r.d20L ? fmtN(r.d20L) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:C.high }}>{r.d20H ? fmtN(r.d20H) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:C.gtt }}>{r.gttPrice ? fmtN(r.gttPrice) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:C.buy }}>{r.buyPrice ? fmtN(r.buyPrice) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right" }}>{r.buyQty || "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right" }}>{r.position ? fmtN(r.position.avgPrice) : "—"}</td>
                    <td style={{ padding:"6px 8px", textAlign:"right", color:C.gtt }}>{r.position ? fmtN(r.position.target) : "—"}</td>
                    <td style={{ padding:"6px 8px", fontSize:10 }}>{(r.events||[]).join(" ")}</td>
                  </tr>;
                })}
              </tbody>
            </table>
          </div>
        </div>}

        {view==="screener" && <ScreenerView stocks={stocks} period={period} onSelect={function(i){ setActive(i); setView("chart"); }}/>}
        {view==="portfolio" && <PortfolioView stocks={stocks} onSelect={function(i){ setActive(i); setView("chart"); }}/>}
      </div>}

      {listOpen && <SheetStockModal
        onClose={function(){ setListOpen(false); }}
        onLoad={function(st){ pickFromList(st); }}
        stockList={stockList}
        sheetInfo={sheetInfo}
        reloadSheet={loadSheet}
        period={period}
        targetSteps={targetSteps}
        fixedAmount={fixedAmount}
      />}

      {modal && <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,.8)", display:"flex", alignItems:"flex-end", zIndex:100 }}
        onClick={function(e){ if (e.currentTarget===e.target) setModal(false); }}>
        <div style={{ background:"#0d1a2a", borderTop:"1px solid "+C.border, borderRadius:"18px 18px 0 0", padding:20, width:"100%", maxHeight:"90vh", overflowY:"auto" }}>
          <div style={{ fontWeight:700, fontSize:16, marginBottom:18 }}>📥 Manual CSV</div>
          <input type="file" accept=".csv,.txt" onChange={onFile}
            style={{ width:"100%", background:C.bg, border:"1px solid "+C.border, borderRadius:8, padding:"10px", color:C.text, marginBottom:10 }}/>
          <textarea value={csvTxt} onChange={function(e){ setCsvTxt(e.target.value); }} rows={4}
            placeholder={"Date,Open,High,Low,Close,Volume"}
            style={{ width:"100%", background:C.bg, border:"1px solid "+C.border, borderRadius:8, padding:"10px", color:C.text, fontSize:11, fontFamily:"monospace", marginBottom:10 }}/>
          {err && <div style={{ color:"#f87171", fontSize:12, marginBottom:12 }}>{err}</div>}
          <div style={{ display:"flex", gap:10 }}>
            <button onClick={function(){ setModal(false); }} style={{ flex:1, background:C.border, color:C.text, border:"none", borderRadius:10, padding:12, cursor:"pointer" }}>Cancel</button>
            <button onClick={submitAdd} style={{ flex:2, background:C.accent, color:"#fff", border:"none", borderRadius:10, padding:12, fontWeight:700, cursor:"pointer" }}>✅ Load CSV</button>
          </div>
        </div>
      </div>}

      {settingsOpen && <SettingsModal C={C} period={period} eps={eps} fixedAmount={fixedAmount} targetSteps={targetSteps}
        onClose={function(){ setSettingsOpen(false); }} onSave={applySettings}/>}

      {toast && <div style={{
        position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",
        background: toast.type==="error" ? "#7f1d1d" : "#052e16",
        color: toast.type==="error" ? "#fecaca" : "#86efac",
        border:"1px solid "+(toast.type==="error"?"#991b1b":"#166534"),
        borderRadius:10,padding:"10px 18px",fontSize:13,fontWeight:600,zIndex:999,maxWidth:"90vw"
      }}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
